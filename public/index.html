<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro Proveedores · MONFRUT</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --verde:#5FA72F; --verde-osc:#3F7A1C; --verde-claro:#E9F5E1; --verde-suave:#F4FAF0;
  --rojo:#E4022C; --rojo-claro:#FDECEF; --ambar:#B7791F; --ambar-claro:#FEF6E4;
  --txt:#1F2A1A; --txt2:#5B6657; --borde:#E2E8DE; --fondo:#F6F8F4; --panel:#FFFFFF;
  --sombra:0 1px 2px rgba(20,40,10,.06),0 2px 8px rgba(20,40,10,.05);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px;color:var(--txt);background:var(--fondo)}
button,input,select{font:inherit;color:inherit}
a{color:var(--verde-osc)}
.oculto{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#fff 0%,var(--verde-claro) 100%)}
.login-box{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(40,80,20,.12);padding:36px 32px;width:100%;max-width:380px;text-align:center}
.login-box img{width:190px;margin-bottom:8px}
.login-box h1{font-size:17px;margin:6px 0 4px}
.login-box p{color:var(--txt2);margin:0 0 22px}
.login-box input{width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:8px;margin-bottom:12px;font-size:14px}
.login-box input:focus{outline:2px solid var(--verde);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--verde-suave)}
.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.prim:hover{background:var(--verde-osc)}
.btn.full{width:100%;justify-content:center;padding:11px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--rojo);min-height:18px;margin-top:10px;font-size:12.5px}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100%}
#nav{width:228px;flex:none;background:#fff;border-right:1px solid var(--borde);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#nav .logo{padding:18px 18px 10px}
#nav .logo img{width:140px;display:block}
#nav .logo small{display:block;color:var(--txt2);margin-top:4px;font-weight:500;letter-spacing:.04em;font-size:10.5px;text-transform:uppercase}
#nav nav{flex:1;overflow:auto;padding:6px 10px}
#nav nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--txt);font-weight:500;margin-bottom:1px}
#nav nav a svg{width:16px;height:16px;flex:none;color:var(--txt2)}
#nav nav a:hover{background:var(--verde-suave)}
#nav nav a.act{background:var(--verde-claro);color:var(--verde-osc)}
#nav nav a.act svg{color:var(--verde-osc)}
#nav nav .sep{height:1px;background:var(--borde);margin:8px 6px}
#nav nav .grp{font-size:10.5px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;padding:4px 10px 4px}
#nav .pie{padding:12px 16px;border-top:1px solid var(--borde);color:var(--txt2);font-size:11.5px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:20}
#top h2{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .act-info{color:var(--txt2);font-size:12px;white-space:nowrap}
#menuBtn{display:none}
#contenido{padding:16px 22px 40px}

/* ---------- Slicers ---------- */
.slicers{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;box-shadow:var(--sombra)}
.sl{display:flex;flex-direction:column;gap:4px;min-width:150px;position:relative}
.sl label{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.03em}
.sl .dd{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--borde);border-radius:7px;padding:7px 10px;background:#fff;cursor:pointer;min-width:150px;max-width:240px;text-align:left}
.sl .dd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .dd.on{border-color:var(--verde);background:var(--verde-suave);color:var(--verde-osc);font-weight:600}
.sl .dd svg{flex:none;width:12px;height:12px;opacity:.6}
.pop{position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--borde);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:50;width:300px;max-width:86vw}
.pop input{width:calc(100% - 16px);margin:8px;padding:7px 9px;border:1px solid var(--borde);border-radius:6px}
.pop .lista{max-height:280px;overflow:auto;padding:0 4px 4px}
.pop .op{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;line-height:1.3}
.pop .op:hover{background:var(--verde-suave)}
.pop .op input{width:auto;margin:0;accent-color:var(--verde)}
.pop .acc{display:flex;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--borde);font-size:12px}
.pop .acc a{cursor:pointer;text-decoration:none;font-weight:600}
.pop .nota{padding:4px 10px;color:var(--txt2);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:500}
.chip:hover{border-color:var(--verde)}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
.rango{display:flex;gap:6px;align-items:center}
.rango input{border:1px solid var(--borde);border-radius:7px;padding:6px 8px;width:138px}
.rango input.num{width:70px}
.slicers .limpiar{margin-left:auto}

/* ---------- Tarjetas / KPIs ---------- */
.grid{display:grid;gap:14px;align-items:start}
.grid>*{min-width:0}
.g2{grid-template-columns:2fr 1fr}
.g2b{grid-template-columns:1fr 1fr}
.g3c{grid-template-columns:3fr 1fr}
.sem{display:inline-flex;align-items:center;gap:6px}
.sem svg{flex:none}
.meses{display:inline-flex;gap:3px;flex-wrap:nowrap}
.meses span{background:#F1F5EE;border:1px solid var(--borde);border-radius:5px;padding:0 5px;font-size:11.5px}
table.t tr.clic{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:13px 16px;box-shadow:var(--sombra)}
.kpi .l{font-size:11px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--txt2);margin-top:2px}
.kpi.rojo .v{color:var(--rojo)} .kpi.verde .v{color:var(--verde-osc)}
.card{background:#fff;border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra);min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--borde)}
.card-h h3{margin:0;font-size:13.5px;flex:1}
.card-h .cnt{color:var(--txt2);font-size:12px}
.card-h input.buscar{border:1px solid var(--borde);border-radius:7px;padding:5px 9px;width:190px}
.card-b{padding:0;overflow:auto}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-top:1px solid var(--borde);color:var(--txt2);font-size:12px}
.mb{margin-bottom:14px}

/* ---------- Tablas ---------- */
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;background:#F1F5EE;z-index:2;text-align:left;font-weight:600;font-size:11.5px;color:var(--txt2);padding:8px 8px;border-bottom:1px solid var(--borde);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.n,table.t td.n{text-align:right}
table.t th:hover{color:var(--txt)}
table.t td{padding:6px 8px;border-bottom:1px solid #EEF2EB;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.t tbody tr:hover td{background:var(--verde-suave)}
table.t tfoot td{position:sticky;bottom:0;background:#F1F5EE;font-weight:700;border-top:1px solid var(--borde)}
table.t td.neg{color:var(--rojo)}
.pdf{display:inline-flex;align-items:center;gap:4px;font-weight:600;text-decoration:none;color:var(--rojo);font-size:12px}
.pdf:hover{text-decoration:underline}
.pdf svg{width:13px;height:13px}
.sinpdf{color:#A0A89C;font-size:12px}
.pag{display:flex;gap:4px;align-items:center}
.pag button{border:1px solid var(--borde);background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer}
.pag button:disabled{opacity:.4;cursor:default}
/* pivote */
table.pv td.f{position:sticky;left:0;background:#fff;z-index:1;font-weight:500}
table.pv th.f{position:sticky;left:0;z-index:3}
table.pv tbody tr:hover td.f{background:var(--verde-suave)}
table.pv tr.l0 td{font-weight:600}
table.pv tr.l1 td.f{padding-left:26px} table.pv tr.l2 td.f{padding-left:42px} table.pv tr.l3 td.f{padding-left:58px}
table.pv tr.l1 td,table.pv tr.l2 td,table.pv tr.l3 td{font-weight:400}
table.pv .tg{display:inline-block;width:16px;cursor:pointer;color:var(--verde-osc);font-weight:700}
table.pv td.tot{font-weight:700;background:#FAFCF8}
table.pv td.cero{color:#C3C9BF}
/* gráficos */
.chart{padding:10px 12px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit;fill:var(--txt2)}
.hbar{padding:10px 14px}
.hbar .row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;padding:4px 0}
.hbar .row .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .row .bar{height:14px;border-radius:0 4px 4px 0;background:var(--verde);min-width:2px}
.hbar .row .vl{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.seg{display:inline-flex;border:1px solid var(--borde);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--verde);color:#fff}

/* ---------- Inicio ---------- */
.hero{display:flex;align-items:center;gap:24px;background:#fff;border:1px solid var(--borde);border-radius:14px;padding:22px 26px;margin-bottom:16px;box-shadow:var(--sombra)}
.hero img{width:200px}
.hero h1{margin:0 0 4px;font-size:21px}
.hero p{margin:0;color:var(--txt2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.tile{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:16px;box-shadow:var(--sombra);transition:.15s}
.tile:hover{border-color:var(--verde);transform:translateY(-1px)}
.tile .ic{width:34px;height:34px;border-radius:9px;background:var(--verde-claro);color:var(--verde-osc);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.tile .ic svg{width:18px;height:18px}
.tile b{display:block;font-size:14px;margin-bottom:3px}
.tile span{color:var(--txt2);font-size:12px;line-height:1.4}

/* ---------- Cargar ---------- */
.drop{display:block;border:2px dashed #C9D6C0;border-radius:12px;padding:30px;text-align:center;background:#fff;cursor:pointer}
.drop:hover,.drop.sobre{border-color:var(--verde);background:var(--verde-suave)}
.drop b{display:block;font-size:14.5px;margin-bottom:4px}
.pasos{margin:0;padding-left:18px;color:var(--txt2);line-height:1.7}
.estado-carga td .ok{color:var(--verde-osc);font-weight:600}
.estado-carga td .falta{color:var(--txt2)}
.barra{height:8px;background:#EEF2EB;border-radius:9px;overflow:hidden;margin:10px 0}
.barra div{height:100%;background:var(--verde);width:0;transition:width .2s}
.aviso{background:var(--ambar-claro);border:1px solid #F3DDA8;color:#7A5410;border-radius:9px;padding:10px 13px;margin-bottom:14px}

.inp{border:1px solid var(--borde);border-radius:7px;padding:8px 10px;width:100%}
.inp:focus{outline:2px solid var(--verde);border-color:transparent}
.inp[readonly]{background:#F1F5EE}
.lbl{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.03em}
.permisos{display:grid;grid-template-columns:1fr 1fr;gap:2px;border:1px solid var(--borde);border-radius:8px;padding:6px}
.op input{accent-color:var(--verde)}
label.op{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer;text-transform:none;font-size:13px;font-weight:400;color:var(--txt);letter-spacing:0}
.pdfc{display:inline-flex;gap:4px;align-items:center}
.pdfb{border:1px solid var(--borde);background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.pdfb svg{width:12px;height:12px}
.pdfb.ver{color:var(--rojo);border-color:#F5C2CB;background:var(--rojo-claro)}
.pdfb.sub{color:var(--verde-osc);border-color:#CFE3C1;background:var(--verde-suave)}
.pdfb.uni{color:#fff;background:var(--verde);border-color:var(--verde)}
.falta{color:#A0A89C;font-size:11.5px;white-space:nowrap}
.pdfb.del{color:var(--txt2)} .pdfb.del:hover,.pdfb.conf{color:#fff;background:var(--rojo);border-color:var(--rojo)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1F2A1A;color:#fff;padding:10px 16px;border-radius:9px;opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)} #toast.err{background:var(--rojo)}
.cargando{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:80px 20px;color:var(--txt2)}
.spin{width:28px;height:28px;border:3px solid var(--verde-claro);border-top-color:var(--verde);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.vacio{padding:30px;text-align:center;color:var(--txt2)}

@media (max-width:1100px){.g2,.g2b,.g3c{grid-template-columns:1fr}}
@media (max-width:820px){
  #nav{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  #nav.abierto{transform:none}
  #menuBtn{display:inline-flex}
  #top{padding:10px 16px}
  #top .act-info{display:none}
  #contenido{padding:12px 16px 30px}
  .hero{flex-direction:column;align-items:flex-start;gap:10px}
  .hero img{width:150px}
  .sl,.sl .dd{min-width:0;max-width:none;width:100%}
  .slicers .sl{flex:1 1 140px}
  .card-h{flex-wrap:wrap}
  .card-h input.buscar{width:100%}
  .kpi .v{font-size:17px}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="login">
  <form class="login-box" id="loginForm">
    <img src="logo.png" alt="MONFRUT">
    <h1>Maestro de Proveedores</h1>
    <p>Facturas, compras, pagos y documentos por pagar</p>
    <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" autocapitalize="none" spellcheck="false">
    <input type="password" id="clave" placeholder="Clave" autocomplete="current-password" required>
    <button class="btn prim full" type="submit">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- ========== APP ========== -->
<div id="app" class="oculto">
  <aside id="nav">
    <div class="logo"><img src="logo.png" alt="MONFRUT"><small>Maestro de Proveedores</small></div>
    <nav id="menu"></nav>
    <div class="pie" id="pie"></div>
  </aside>
  <div id="main">
    <header id="top">
      <button class="btn" id="menuBtn" aria-label="Menú">☰</button>
      <h2 id="titulo">Inicio</h2>
      <span class="act-info" id="actInfo"></span>
      <button class="btn" id="btnRecargar" title="Volver a leer los datos desde Neon">Recargar</button>
      <button class="btn" id="btnSalir" title="Cerrar sesión">Salir</button>
    </header>
    <div id="contenido"></div>
  </div>
</div>

<script>
/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = s => document.querySelector(s);
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3 = MESES.map(m => m.slice(0,3));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-CL', {maximumFractionDigits:0});
const clp = n => (n == null || isNaN(n)) ? '' : (n < 0 ? '-$' : '$') + nf.format(Math.abs(Math.round(n)));
const num = n => (n == null || isNaN(n)) ? '' : nf.format(n);
const fecha = d => d ? `${d.slice(8,10)}-${d.slice(5,7)}-${d.slice(0,4)}` : '';
const anio = d => d ? +d.slice(0,4) : null;
const mes = d => d ? +d.slice(5,7) : null;
const hoyISO = () => new Date().toISOString().slice(0,10);
const pct = (a,b) => b ? (a/b*100).toFixed(1).replace('.',',') + '%' : '–';
function semanaISO(d){ // 'YYYY-Www'
  const t = new Date(d + 'T00:00:00Z'); const dia = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - dia + 3);
  const y = t.getUTCFullYear(); const p = new Date(Date.UTC(y,0,4));
  const w = 1 + Math.round(((t - p) / 864e5 - 3 + ((p.getUTCDay() + 6) % 7)) / 7);
  return `${y}-S${String(w).padStart(2,'0')}`;
}
const primerLink = s => s ? String(s).split(/[,\s]+/).find(x => /^https?:\/\//.test(x)) : null;
const ICO_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const pdfLink = u => { const l = primerLink(u); return l ? `<a class="pdf" href="${esc(l)}" target="_blank" rel="noopener">${ICO_PDF}PDF</a>` : '<span class="sinpdf">—</span>'; };
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
const ss = { get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, del(k){ try { sessionStorage.removeItem(k); } catch(e){} } };

const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
  pago:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  reloj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  casco:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 18h20M4 18v-3a8 8 0 0 1 16 0v3M12 7V4"/></svg>',
  proy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',

/* =====================================================================
   Estado + API
   ===================================================================== */
const S = { usuario: ss.get('usuario') || '', clave: ss.get('clave') || '', datos: null, estado: null, pagina: 'inicio', filtros: {}, opc: {}, abierto: null };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-usuario': encodeURIComponent(S.usuario), 'x-clave': encodeURIComponent(S.clave), ...(opts.headers || {}) } });
  let j; try { j = await r.json(); } catch(e) { throw new Error('Respuesta inválida del servidor (' + r.status + ')'); }
  if (!r.ok) { const e = new Error(j.error || ('Error ' + r.status)); e.status = r.status; throw e; }
  return j;
}

async function traerVista(v, onProg) {
  const LIM = 4000;
  const primero = await api(`/api/datos?v=${v}&offset=0&limit=${LIM}`);
  const cols = primero.cols; let filas = primero.rows;
  const pend = [];
  for (let o = LIM; o < primero.total; o += LIM) pend.push(api(`/api/datos?v=${v}&offset=${o}&limit=${LIM}`));
  (await Promise.all(pend)).forEach(p => filas = filas.concat(p.rows));
  onProg && onProg();
  return filas.map(r => { const o = {}; cols.forEach((c,i) => o[c] = r[i]); return o; });
}

async function cargarTodo() {
  $('#contenido').innerHTML = `<div class="cargando"><div class="spin"></div><div id="progTxt">Leyendo datos desde Neon…</div></div>`;
  S.estado = await api('/api/datos?v=estado');
  let n = 0; const prog = () => { const el = $('#progTxt'); if (el) el.textContent = `Leyendo datos desde Neon… (${++n})`; };
  const vistas = S.estado.vistas || []; const tot = vistas.length;
  const prog2 = () => { const el = $('#progTxt'); if (el) el.textContent = `Leyendo datos desde Neon… (${++n}/${tot})`; };
  const [compras, saldo, pagos, maestro, cruce] = await Promise.all(['compras','saldo','pagos','maestro','cruce'].map(v => vistas.includes(v) ? traerVista(v, prog2) : Promise.resolve([])));
  compras.forEach(r => r.razon_social = limpiarNombre(r.razon_social));
  saldo.forEach(r => r.razon_social = limpiarNombre(r.razon_social));
  pagos.forEach(r => r.nombre_proveedor = limpiarNombre(r.nombre_proveedor));
  cruce.forEach(r => r.razon_social = limpiarNombre(r.razon_social));
  S.datos = { compras, saldo, pagos, maestro, cruce };
  pintarActualizacion();
}
const limpiarNombre = s => s == null ? s : String(s).replace(/^'+/, '').trim();

function pintarActualizacion() {
  const u = S.estado && S.estado.ultima;
  const txt = u ? 'Última actualización: ' + new Date(u.fecha).toLocaleString('es-CL', {dateStyle:'medium', timeStyle:'short'}) : 'Sin cargas registradas';
  $('#actInfo').textContent = txt; $('#pie').textContent = txt;
}

/* =====================================================================
   Filtros (segmentadores tipo Power BI)
   ===================================================================== */
function fget(p) { if (!S.filtros[p.id]) S.filtros[p.id] = JSON.parse(JSON.stringify(p.defaults || {})); return S.filtros[p.id]; }

function pasa(f, val, r) {
  if (val == null) return true;
  if (f.tipo === 'multi' || f.tipo === 'chips') { if (!val.length) return true; const x = f.get(r); return val.includes(x == null ? '(En blanco)' : x); }
  if (f.tipo === 'fecha') { const x = f.get(r); if (val.desde && (!x || x < val.desde)) return false; if (val.hasta && (!x || x > val.hasta)) return false; return true; }
  if (f.tipo === 'rango') { const x = f.get(r); if (val.min !== '' && val.min != null && (x == null || x < +val.min)) return false; if (val.max !== '' && val.max != null && (x == null || x > +val.max)) return false; return true; }
  return true;
}
function filtrar(p, filas, excepto) {
  const F = fget(p); const act = p.filtros.filter(f => f.k !== excepto && F[f.k] != null && !(Array.isArray(F[f.k]) && !F[f.k].length));
  if (!act.length) return filas;
  return filas.filter(r => act.every(f => pasa(f, F[f.k], r)));
}
function opciones(p, f, filas) {
  const set = new Map();
  for (const r of filtrar(p, filas, f.k)) { let v = f.get(r); if (v == null || v === '') v = '(En blanco)'; set.set(v, (set.get(v) || 0) + 1); }
  const sel = fget(p)[f.k] || []; sel.forEach(v => { if (!set.has(v)) set.set(v, 0); });
  let arr = [...set.keys()];
  arr.sort((a,b) => (typeof a === 'number' && typeof b === 'number') ? a - b : String(a).localeCompare(String(b), 'es', {numeric:true}));
  if (f.desc) arr.reverse();
  return arr;
}
const etiqueta = (f, v) => f.fmt ? f.fmt(v) : String(v);

function htmlSlicer(p, f, filas) {
  const F = fget(p); const val = F[f.k];
  if (f.tipo === 'chips') {
    const ops = opciones(p, f, filas);
    return `<div class="sl" data-k="${f.k}"><label>${esc(f.label)}</label><div class="chips">${ops.map(o =>
      `<button class="chip ${val && val.includes(o) ? 'on' : ''}" data-v="${esc(JSON.stringify(o))}">${esc(etiqueta(f,o))}</button>`).join('')}</div></div>`;
  }
  if (f.tipo === 'fecha') {
    const v = val || {};
    return `<div class="sl" data-k="${f.k}"><label>${esc(f.label)}</label><div class="rango">
      <input type="date" data-r="desde" value="${v.desde || ''}" aria-label="Desde"><span>a</span><input type="date" data-r="hasta" value="${v.hasta || ''}" aria-label="Hasta"></div></div>`;
  }
  if (f.tipo === 'rango') {
    const v = val || {};
    return `<div class="sl" data-k="${f.k}"><label>${esc(f.label)}</label><div class="rango">
      <input class="num" type="number" data-r="min" value="${v.min ?? ''}" placeholder="desde"><span>a</span><input class="num" type="number" data-r="max" value="${v.max ?? ''}" placeholder="hasta"></div></div>`;
  }
  const n = val ? val.length : 0;
  const txt = !n ? 'Todos' : n === 1 ? etiqueta(f, val[0]) : `${n} seleccionados`;
  return `<div class="sl" data-k="${f.k}"><label>${esc(f.label)}</label>
    <button class="dd ${n ? 'on' : ''}"><span>${esc(txt)}</span>${IC.flecha}</button></div>`;
}

function pintarPop(p, f, filas, cont, busq = '') {
  const F = fget(p); const sel = F[f.k] || [];
  const ops = opciones(p, f, filas);
  const q = busq.trim().toLowerCase();
  const vis = q ? ops.filter(o => etiqueta(f,o).toLowerCase().includes(q)) : ops;
  const MAX = 400;
  cont.querySelector('.pop')?.remove();
  const d = document.createElement('div'); d.className = 'pop';
  d.innerHTML = `<input type="search" placeholder="Buscar…" value="${esc(busq)}">
    <div class="lista">${vis.slice(0,MAX).map(o => `<label class="op"><input type="checkbox" data-v="${esc(JSON.stringify(o))}" ${sel.includes(o) ? 'checked' : ''}><span>${esc(etiqueta(f,o))}</span></label>`).join('') || '<div class="nota">Sin resultados</div>'}</div>
    ${vis.length > MAX ? `<div class="nota">Mostrando ${MAX} de ${nf.format(vis.length)}. Escribe para buscar.</div>` : ''}
    <div class="acc"><a data-a="todos">Marcar visibles</a><a data-a="limpiar">Limpiar</a></div>`;
  cont.appendChild(d);
  const inp = d.querySelector('input[type=search]');
  inp.addEventListener('input', debounce(() => { pintarPop(p, f, filas, cont, inp.value); const i2 = cont.querySelector('.pop input[type=search]'); i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); }, 180));
  d.querySelectorAll('.lista input').forEach(cb => cb.addEventListener('change', () => {
    const v = JSON.parse(cb.dataset.v); let s = F[f.k] || [];
    s = cb.checked ? [...s, v] : s.filter(x => x !== v);
    F[f.k] = s; refrescar(p, f.k);
  }));
  d.querySelector('[data-a=todos]').onclick = () => { F[f.k] = [...new Set([...(F[f.k] || []), ...vis.slice(0,MAX)])]; pintarPop(p, f, filas, cont, inp.value); refrescar(p, f.k); };
  d.querySelector('[data-a=limpiar]').onclick = () => { F[f.k] = []; pintarPop(p, f, filas, cont, inp.value); refrescar(p, f.k); };
  d.addEventListener('click', e => e.stopPropagation());
  if (!busq) setTimeout(() => inp.focus(), 0);
}

document.addEventListener('click', () => { if (S.abierto) { S.abierto = null; document.querySelectorAll('.pop').forEach(x => x.remove()); } });

function pintarSlicers(p, filas, excepto) {
  const bar = $('#slicers'); if (!bar) return;
  if (!bar.dataset.init) {
    bar.dataset.init = 1;
    bar.innerHTML = p.filtros.map(f => `<div class="slw" data-w="${f.k}"></div>`).join('') + `<button class="btn limpiar" id="btnLimpiar">Borrar filtros</button>`;
    $('#btnLimpiar').onclick = () => { S.filtros[p.id] = JSON.parse(JSON.stringify(p.defaults || {})); S.abierto = null; renderPagina(); };
  }
  for (const f of p.filtros) {
    if (f.k === excepto) continue;
    const w = bar.querySelector(`[data-w="${f.k}"]`);
    w.innerHTML = htmlSlicer(p, f, filas);
    const sl = w.firstElementChild;
    if (f.tipo === 'multi') {
      sl.querySelector('.dd').addEventListener('click', e => {
        e.stopPropagation();
        const ya = S.abierto === f.k; document.querySelectorAll('.pop').forEach(x => x.remove());
        S.abierto = ya ? null : f.k; if (!ya) pintarPop(p, f, filas, sl);
      });
    } else if (f.tipo === 'chips') {
      sl.querySelectorAll('.chip').forEach(b => b.onclick = () => {
        const F = fget(p); const v = JSON.parse(b.dataset.v); const s = F[f.k] || [];
        F[f.k] = s.includes(v) ? s.filter(x => x !== v) : [...s, v]; refrescar(p);
      });
    } else {
      sl.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
        const F = fget(p); F[f.k] = { ...(F[f.k] || {}), [inp.dataset.r]: inp.value }; refrescar(p);
      }));
    }
  }
}

const refrescar = debounce((p, excepto) => {
  const filas = fuente(p);
  pintarSlicers(p, filas, excepto);
  if (S.abierto && S.abierto !== excepto) S.abierto = null;
  pintarCuerpo(p, filas);
}, 120);

function fuente(p) { const f = p.src(S.datos); return f; }

/* =====================================================================
   Componentes: tabla, matriz (pivote), barras, KPIs
   ===================================================================== */
const FMT = {
  clp: v => clp(v), num: v => num(v), fecha: v => fecha(v), txt: v => esc(v ?? ''), pdf: v => pdfLink(v),
};
function celda(c, r) {
  const v = c.v(r);
  if (c.html) return c.html(r);
  return (FMT[c.f || 'txt'])(v);
}
const esNum = c => c.f === 'clp' || c.f === 'num';

function tabla(el, cfg) {
  const st = { orden: cfg.orden ?? null, dir: cfg.dir ?? 1, pag: 0, q: '' };
  const TAM = cfg.tam || 100;
  el.innerHTML = `<div class="card ${cfg.cls || ''}">
    <div class="card-h"><h3>${esc(cfg.titulo)}</h3><span class="cnt"></span>
      ${cfg.buscar === false ? '' : '<input class="buscar" type="search" placeholder="Buscar en la tabla…">'}
      <button class="btn exp" title="Descargar CSV para Excel">Exportar</button></div>
    <div class="card-b" style="max-height:${cfg.alto || 520}px"></div>
    <div class="card-f"><span class="info"></span><div class="pag"><button data-p="-1">‹</button><span class="pn"></span><button data-p="1">›</button></div></div></div>`;
  const body = el.querySelector('.card-b');
  const lista = () => {
    let f = cfg.filas;
    if (st.q) { const q = st.q.toLowerCase(); f = f.filter(r => cfg.cols.some(c => { const v = c.v(r); return v != null && String(c.f === 'fecha' ? fecha(v) : v).toLowerCase().includes(q); })); }
    if (st.orden != null) { const c = cfg.cols[st.orden]; f = [...f].sort((a,b) => { const x = c.v(a), y = c.v(b); if (x == null) return 1; if (y == null) return -1; return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'es', {numeric:true})) * st.dir; }); }
    return f;
  };
  const pintar = () => {
    const f = lista(); const np = Math.max(1, Math.ceil(f.length / TAM)); st.pag = Math.min(st.pag, np - 1);
    const vis = f.slice(st.pag * TAM, st.pag * TAM + TAM);
    const tot = cfg.cols.map(c => c.sum ? f.reduce((s,r) => s + (c.v(r) || 0), 0) : null);
    const vis_ = (c) => !c.soloCSV;
    body.innerHTML = `<table class="t"><thead><tr>${cfg.cols.map((c,i) => !vis_(c) ? '' : `<th data-i="${i}" class="${esNum(c) ? 'n' : ''}">${esc(c.t)}${st.orden === i ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${vis.map((r, ri) => `<tr${cfg.alClic ? ` data-ri="${ri}" class="clic"` : ''}>${cfg.cols.filter(vis_).map(c => { const v = c.v(r); return `<td class="${esNum(c) ? 'n' : ''} ${esNum(c) && v < 0 ? 'neg' : ''}"${c.max ? ` style="max-width:${c.max}px"` : ''} title="${c.f === 'pdf' || (c.html && !c.max) ? '' : esc(c.f === 'fecha' ? fecha(v) : (esNum(c) ? '' : v ?? ''))}">${celda(c, r)}</td>`; }).join('')}</tr>`).join('') || `<tr><td colspan="${cfg.cols.filter(vis_).length}" class="vacio">Sin datos para los filtros elegidos</td></tr>`}</tbody>
      ${tot.some(x => x != null) ? `<tfoot><tr>${cfg.cols.map((c,i) => !vis_(c) ? '' : `<td class="${esNum(c) ? 'n' : ''}">${i === 0 ? 'Total' : tot[i] != null ? FMT[c.f](tot[i]) : ''}</td>`).join('')}</tr></tfoot>` : ''}</table>`;
    if (cfg.alClic) body.querySelectorAll('tr[data-ri]').forEach(tr => tr.onclick = e => { if (e.target.closest('a')) return; cfg.alClic(vis[+tr.dataset.ri]); });
    body.querySelectorAll('th').forEach(th => th.onclick = () => { const i = +th.dataset.i; if (st.orden === i) st.dir *= -1; else { st.orden = i; st.dir = esNum(cfg.cols[i]) ? -1 : 1; } pintar(); });
    el.querySelector('.cnt').textContent = `${nf.format(f.length)} filas`;
    el.querySelector('.info').textContent = f.length ? `Filas ${nf.format(st.pag * TAM + 1)}–${nf.format(Math.min(f.length, st.pag * TAM + TAM))} de ${nf.format(f.length)}` : '';
    el.querySelector('.pn').textContent = `${st.pag + 1} / ${np}`;
    el.querySelector('[data-p="-1"]').disabled = st.pag === 0;
    el.querySelector('[data-p="1"]').disabled = st.pag >= np - 1;
  };
  el.querySelectorAll('.pag button').forEach(b => b.onclick = () => { st.pag += +b.dataset.p; pintar(); body.scrollTop = 0; });
  const bq = el.querySelector('.buscar'); if (bq) bq.addEventListener('input', debounce(() => { st.q = bq.value; st.pag = 0; pintar(); }, 200));
  el.querySelector('.exp').onclick = () => exportarCSV(cfg.titulo, cfg.cols, lista());
  pintar();
}

function exportarCSV(nombre, cols, filas) {
  const e = v => { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lin = [cols.map(c => e(c.t)).join(';')].concat(filas.map(r => cols.map(c => { const v = c.v(r); return e(c.f === 'fecha' ? fecha(v) : c.f === 'pdf' ? primerLink(v) : (typeof v === 'number' ? String(Math.round(v * 100) / 100).replace('.', ',') : v)); }).join(';')));
  const blob = new Blob(['﻿' + lin.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre.replace(/[^\w\- ]+/g, '').trim() + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Matriz: filas jerárquicas (expandibles) × columnas opcionales */
function matriz(el, cfg) {
  const abiertos = new Set();
  let limite = cfg.limite || 150;
  const colKey = cfg.col ? cfg.col.v : null;
  const colsSet = new Map();
  const raiz = { hijos: new Map(), vals: new Map(), tot: 0 };
  for (const r of cfg.filas) {
    const val = cfg.val(r) || 0; if (!val && cfg.omitirCeros) continue;
    let ck = null;
    if (colKey) { ck = colKey(r); if (ck == null) ck = '(En blanco)'; colsSet.set(ck, true); }
    let nodo = raiz; nodo.tot += val; if (ck != null) nodo.vals.set(ck, (nodo.vals.get(ck) || 0) + val);
    cfg.niveles.forEach((nv, i) => {
      let k = nv.v(r); if (k == null || k === '') k = '(En blanco)';
      let h = nodo.hijos.get(k);
      if (!h) { h = { k, lbl: nv.lbl ? nv.lbl(k, r) : esc(nv.fmt ? nv.fmt(k) : k), hijos: new Map(), vals: new Map(), tot: 0 }; nodo.hijos.set(k, h); }
      h.tot += val; if (ck != null) h.vals.set(ck, (h.vals.get(ck) || 0) + val);
      nodo = h;
    });
  }
  let cols = [...colsSet.keys()].sort((a,b) => cfg.col && cfg.col.sort ? cfg.col.sort(a,b) : (typeof a === 'number' ? a - b : String(a).localeCompare(String(b), 'es', {numeric:true})));
  const fm = FMT[cfg.fmt || 'clp'];
  const ordenar = (m, nivel) => { const arr = [...m.values()]; const nv = cfg.niveles[nivel];
    if (nv.orden === 'valor') arr.sort((a,b) => b.tot - a.tot);
    else arr.sort((a,b) => nv.sort ? nv.sort(a.k, b.k) : (typeof a.k === 'number' ? a.k - b.k : String(a.k).localeCompare(String(b.k), 'es', {numeric:true})));
    if (nv.desc) arr.reverse(); return arr; };
  const fila = (n, nivel, ruta) => {
    const tieneHijos = nivel < cfg.niveles.length - 1 && n.hijos.size;
    const ab = abiertos.has(ruta);
    const celdas = cols.map(c => { const v = n.vals.get(c); return `<td class="n ${!v ? 'cero' : ''} ${v < 0 ? 'neg' : ''}">${v ? fm(v) : '–'}</td>`; }).join('');
    let h = `<tr class="l${nivel}"><td class="f">${tieneHijos ? `<span class="tg" data-r="${esc(ruta)}">${ab ? '−' : '+'}</span>` : '<span class="tg"></span>'}${n.lbl}</td>${celdas}<td class="n tot ${n.tot < 0 ? 'neg' : ''}">${fm(n.tot)}</td></tr>`;
    if (tieneHijos && ab) ordenar(n.hijos, nivel + 1).forEach(hj => h += fila(hj, nivel + 1, ruta + '\u0001' + hj.k));
    return h;
  };
  el.innerHTML = `<div class="card"><div class="card-h"><h3>${esc(cfg.titulo)}</h3>${cfg.extra || ''}
      ${cfg.niveles.length > 1 ? '<button class="btn" data-a="exp">Expandir todo</button><button class="btn" data-a="col">Contraer</button>' : ''}</div>
    <div class="card-b" style="max-height:${cfg.alto || 460}px"></div><div class="card-f oculto"></div></div>`;
  const body = el.querySelector('.card-b'); const pie = el.querySelector('.card-f');
  const pintar = () => {
    if (!raiz.hijos.size) { body.innerHTML = '<div class="vacio">Sin datos para los filtros elegidos</div>'; return; }
    const top = ordenar(raiz.hijos, 0);
    const vis = top.slice(0, limite);
    body.innerHTML = `<table class="t pv"><thead><tr><th class="f">${esc(cfg.niveles.map(n => n.t).join(' › '))}</th>${cols.map(c => `<th class="n">${esc(cfg.col.fmt ? cfg.col.fmt(c) : c)}</th>`).join('')}<th class="n">Total</th></tr></thead>
      <tbody>${vis.map(n => fila(n, 0, String(n.k))).join('')}</tbody>
      <tfoot><tr><td class="f">Total</td>${cols.map(c => `<td class="n">${fm(raiz.vals.get(c) || 0)}</td>`).join('')}<td class="n">${fm(raiz.tot)}</td></tr></tfoot></table>`;

// ¿Puede el usuario actual ver esta página?
function permitida(p) {
  const e = S.estado; if (!e) return p.id === 'inicio';
  if (p.id === 'inicio') return true;
  if (p.soloAdmin) return !!e.admin;
  return (e.paginas || []).includes(p.id);
}

/* =====================================================================
   Navegación / render
   ===================================================================== */
function pintarMenu() {
  let g0 = null;
  $('#menu').innerHTML = PAGINAS.filter(permitida).map((p, i) => (p.id === 'cargar' ? '<div class="sep"></div>' : '') +
    (p.grupo && p.grupo !== g0 ? (g0 = p.grupo, `<div class="sep"></div><div class="grp">${esc(p.grupo)}</div>`) : '') +
    `<a href="#${p.id}" class="${S.pagina === p.id ? 'act' : ''}">${IC[p.ic]}${esc(p.titulo)}</a>` + (i === 0 ? '<div class="sep"></div>' : '')).join('');
}

function renderPagina() {
  let p = PAGINAS.find(x => x.id === S.pagina) || PAGINAS[0];
  if (S.estado && !permitida(p)) { p = PAGINAS[0]; S.pagina = 'inicio'; if (location.hash && location.hash !== '#inicio') history.replaceState(null, '', '#inicio'); }
  $('#titulo').textContent = p.titulo; document.title = p.titulo + ' · Maestro Proveedores';
  pintarMenu(); $('#nav').classList.remove('abierto'); S.abierto = null;
  const c = $('#contenido');
  if (p.id === 'inicio') return pintarInicio(c);
  if (p.id === 'cargar') return pintarCargar(c);
  if (p.id === 'usuarios') return pintarUsuarios(c);
  if (!S.datos) return;
  if (!S.filtros[p.id] && p.defaultsDin) S.filtros[p.id] = p.defaultsDin(S.datos);
  c.innerHTML = `<div class="slicers" id="slicers"></div><div id="cuerpo"></div>`;
  const filas = fuente(p);
  pintarSlicers(p, filas);
  pintarCuerpo(p, filas);
}
function pintarCuerpo(p, filas) {
  const el = $('#cuerpo'); if (!el) return;
  const f = filtrar(p, filas);
  const sy = window.scrollY;
  p.cuerpo(f, el, p);
  window.scrollTo(0, sy);
}

  const y = new Date().getFullYear();
  const pagAnio = d ? suma(d.pagos.filter(r => anio(r.fecha_pago) === y), r => r.monto) : 0;
  const conPdf = d ? d.compras.filter(r => r.foto).length : 0;
  const u = S.estado && S.estado.ultima;
  c.innerHTML = `<div class="hero"><img src="logo.png" alt="MONFRUT"><div><h1>Hola${S.estado && S.estado.nombre ? ', ' + esc(S.estado.nombre) : ''}</h1>
      <p>Maestro de Proveedores · Facturas digitalizadas, pagos, documentos por pagar y proyecciones. Datos en Neon.</p>
      <p style="margin-top:6px"><b>Última actualización:</b> ${u ? new Date(u.fecha).toLocaleString('es-CL', {dateStyle:'long', timeStyle:'short'}) : 'sin datos — ve a “Actualizar datos”'}</p></div></div>
    ${(() => { if (!d) return ''; const pg = (S.estado && S.estado.paginas) || []; const k = [];
      if (pg.includes('porpagar') && d.saldo.length) k.push({ l: 'Saldo por pagar', v: clp(saldo), s: 'Cuenta 2107101' }, { l: 'Vencido', v: clp(venc), c: 'rojo', s: 'al ' + fecha(hoy) });
      if (pg.includes('pagos') && d.pagos.length) k.push({ l: 'Pagado ' + y, v: clp(pagAnio), c: 'verde' });
      if (pg.includes('cruce') && d.cruce.length) { const pe = d.cruce.filter(r => r.estado === 'Pendiente'); k.push({ l: 'Faltantes cruce SII', v: nf.format(pe.length), c: pe.length ? 'rojo' : 'verde', s: clp(suma(pe, r => r.monto_total)) + ' por ingresar' }); }

   ===================================================================== */
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const serialAISO = n => { const d = new Date(Math.round((n - 25569) * 864e5)); return d.toISOString(); };
// Corrige textos con tildes/ñ mal codificados (ej. "COMPAÃ‘IA" -> "COMPAÑIA"), como vienen a veces del SII
const CP1252 = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function arreglarTexto(s) {
  if (!/[ÃÂ]/.test(s)) return s;
  try {
    const bytes = []; for (const ch of s) { const c = ch.codePointAt(0); if (c < 256) bytes.push(c); else if (CP1252[c]) bytes.push(CP1252[c]); else return s; }
    return new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array(bytes));
  } catch (e) { return s; }
}
const conv = {
  t: v => { if (v == null) return null; const s = String(v).trim(); return s === '' ? null : s; },
  nom: v => { if (v == null) return null; const s = arreglarTexto(String(v).replace(/^'+/, '').trim()); return s === '' ? null : s; },
  n: v => { if (v == null || v === '') return null; if (typeof v === 'number') return isFinite(v) ? v : null; const x = Number(String(v).replace(/\s|\$/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(x) ? x : null; },
  i: v => { const x = conv.n(v); return x == null ? null : Math.round(x); },
  it: v => { if (v == null || v === '') return null; if (typeof v === 'number') return String(Math.round(v)); const s = String(v).trim(); return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s, 10)) : (s || null); },
  d: v => {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v > 1000 && v < 80000 ? serialAISO(v).slice(0,10) : null;
    const s = String(v).trim(); let m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    return null;
  },
  ts: v => {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v > 1000 && v < 80000 ? serialAISO(v).slice(0,19).replace('T', ' ') : null;
    const s = String(v).trim(); let m;
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\s*(\d{1,2}:\d{2}(:\d{2})?)?/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')} ${m[4] || '00:00'}`;
    return conv.d(s);
  },
};

function leerHoja(ws, m) {
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
  let h = -1;
  for (let i = 0; i < Math.min(20, aoa.length); i++) if ((aoa[i] || []).some(c => norm(c) === m.clave)) { h = i; break; }
  if (h < 0) throw new Error(`No encontré la columna "${m.clave}" en la hoja ${m.hoja}`);
  const idx = {}; (aoa[h] || []).forEach((c, j) => { const k = norm(c); if (k && idx[k] == null) idx[k] = j; });
  const faltan = m.cols.filter(c => idx[c[1]] == null).map(c => c[1]);
  const filas = [];
  for (let i = h + 1; i < aoa.length; i++) {
    const row = aoa[i]; if (!row) continue;
    const o = {}; let alguno = false;
    for (const [col, hd, tp] of m.cols) { const v = idx[hd] == null ? null : conv[tp](row[idx[hd]]); o[col] = v; if (v != null) alguno = true; }
    if (alguno && m.filtro(o)) filas.push(o);
  }
  return { filas, faltan };
}

function pintarPrev() {

async function leerArchivos(files) {
  const msg = $('#msgCarga');
  if (!window.XLSX) { msg.textContent = 'Cargando lector de Excel…'; await new Promise(r => setTimeout(r, 1500)); }
  for (const f of files) {
    msg.textContent = `Leyendo ${f.name}…`; await new Promise(r => setTimeout(r, 30));
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: false, cellFormula: false, cellHTML: false, cellStyles: false });
      const nombres = wb.SheetNames.map(n => [n, n.trim().toUpperCase()]);
      let usados = 0;
      for (const [t, m] of Object.entries(MAPEOS)) {
        const hit = nombres.find(([, u]) => u === m.hoja.toUpperCase()) || (t === 'compras' ? nombres.find(([, u]) => u.startsWith('COMPRAS')) : null);
        if (!hit) continue;
        // Hoja1 / Hoja2 / Hoja4 solo cuentan si vienen del libro de pagos (se valida por columnas)
        try { const r = m.especial ? m.especial(wb.Sheets[hit[0]]) : leerHoja(wb.Sheets[hit[0]], m); if (!r.filas.length && /^HOJA/.test(hit[1])) continue; PREP[t] = { ...r, archivo: f.name }; usados++; } catch (e) { if (!/^HOJA/.test(hit[1])) msg.textContent = e.message; }
      }
      if (!usados) msg.textContent = `${f.name}: no reconocí ninguna hoja.`;
    } catch (e) { msg.textContent = `No pude leer ${f.name}: ${e.message}`; }
  }
  msg.textContent = Object.keys(PREP).length ? 'Listo. Revisa las filas y presiona “Subir a Neon”.' : msg.textContent;
  pintarPrev();
}
async function subir() {
  const btn = $('#btnSubir'), msg = $('#msgCarga'), barra = $('#barra');
  btn.disabled = true;
  const LOTE = 2000; const tareas = [];
  for (const [t, p] of Object.entries(PREP)) { const n = Math.max(1, Math.ceil(p.filas.length / LOTE)); for (let i = 0; i < n; i++) tareas.push({ t, i, filas: p.filas.slice(i * LOTE, (i + 1) * LOTE) }); }
  try {
    let hechas = 0;
    for (const k of tareas) {
      msg.textContent = `Subiendo ${k.t} (${k.i + 1})…`;
      await api('/api/cargar', { method: 'POST', body: JSON.stringify({ tabla: k.t, reemplazar: k.i === 0, filas: k.filas }) });
      barra.style.width = (++hechas / tareas.length * 100) + '%';
    }
    const detalle = {}; for (const [t, p] of Object.entries(PREP)) detalle[t] = { filas: p.filas.length, archivo: p.archivo };
    await api('/api/cargar', { method: 'POST', body: JSON.stringify({ fin: true, detalle }) });
    msg.innerHTML = '<b style="color:var(--verde-osc)">Datos actualizados en Neon.</b> Recargando…';
    PREP = {};
    await cargarTodo(); location.hash = '#inicio'; renderPagina();
  } catch (e) {
    msg.innerHTML = `<span style="color:var(--rojo)">Error: ${esc(e.message)}</span>`; btn.disabled = false;
  }
}

      f.querySelectorAll('[name=pag]').forEach(x => x.checked = (u.paginas || []).includes(x.value));
      f.admin.checked = u.admin; f.activo.checked = u.activo;
      $('#fTit').textContent = 'Editar: ' + u.usuario; $('#lblClave').textContent = 'Nueva clave (déjala vacía para no cambiarla)'; $('#fEliminar').hidden = false;
    });
  };
  f.onsubmit = async e => {
    e.preventDefault(); $('#fErr').textContent = '';
    const body = { accion: 'guardar', usuario: f.usuario.value.trim().toLowerCase(), nombre: f.nombre.value.trim(), clave: f.clave.value,
      paginas: [...f.querySelectorAll('[name=pag]:checked')].map(x => x.value), admin: f.admin.checked, activo: f.activo.checked };
    try { await api('/api/usuarios', { method: 'POST', body: JSON.stringify(body) }); limpiar(); await cargar(); $('#fErr').innerHTML = '<span style="color:var(--verde-osc)">Usuario guardado.</span>'; }
    catch (err) { $('#fErr').textContent = err.message; }
  };
  $('#fEliminar').onclick = async () => {
    const u = f.usuario.value; const b = $('#fEliminar');
    if (b.dataset.conf !== u) { b.dataset.conf = u; b.textContent = '¿Eliminar ' + u + '? Clic de nuevo'; return; }
    try { await api('/api/usuarios', { method: 'POST', body: JSON.stringify({ accion: 'eliminar', usuario: u }) }); b.dataset.conf = ''; b.textContent = 'Eliminar'; limpiar(); await cargar(); }
    catch (err) { $('#fErr').textContent = err.message; }
  };
  cargar();
}

/* =====================================================================
   Arranque
   ===================================================================== */
async function entrar() {
  $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  S.pagina = (location.hash || '#inicio').slice(1);
  renderPagina();
  try { await cargarTodo(); renderPagina(); }
  catch (e) {
    if (e.status === 401) { ss.del('clave'); S.estado = null; $('#app').classList.add('oculto'); $('#login').classList.remove('oculto'); $('#loginErr').textContent = e.message; return; }
    $('#contenido').innerHTML = `<div class="aviso"><b>No se pudo leer la base de datos.</b><br>${esc(e.message)}</div>`;
  }
}
$('#loginForm').onsubmit = e => { e.preventDefault(); S.usuario = $('#usuario').value.trim(); S.clave = $('#clave').value; ss.set('usuario', S.usuario); ss.set('clave', S.clave); $('#loginErr').textContent = ''; entrar(); };
window.addEventListener('hashchange', () => { S.pagina = (location.hash || '#inicio').slice(1); renderPagina(); window.scrollTo(0,0); });
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#nav').classList.toggle('abierto'); };
$('#btnRecargar').onclick = async () => { try { await cargarTodo(); renderPagina(); } catch (e) { $('#contenido').innerHTML = `<div class="aviso">${esc(e.message)}</div>`; } };
$('#btnSalir').onclick = () => { ss.del('clave'); ss.del('usuario'); location.hash = ''; location.reload(); };
if (S.clave) entrar();
</script>
