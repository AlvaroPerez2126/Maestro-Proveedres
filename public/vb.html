<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firma de facturas · Circuito V°B°</title>
<!-- pdf-lib: estampa las firmas sobre el PDF real (requiere internet la primera vez) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>window.PDFLib || document.write('<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"><\/script>')</script>
<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --ink:#16212e; --ink-2:#3b4757; --muted:#6b7686; --line:#e2e7ee;
  --primary:#1d4f80; --primary-h:#163e66; --primary-soft:#e8f0f8;
  --side:#10233a; --side-2:#163049; --side-ink:#b8c5d5;
  --ok:#15803d; --ok-soft:#e7f6ec; --warn:#b45309; --warn-soft:#fff4e2; --danger:#b91c1c; --danger-soft:#fdecec;
  --radius:12px; --shadow:0 1px 2px rgba(16,35,58,.06),0 6px 20px rgba(16,35,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.muted{color:var(--muted)} .small{font-size:12.5px} .hidden{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#c9d2de;background:#f8fafc}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.success{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.success:hover{filter:brightness(.93)}
.btn.warn{background:#f59e0b;border-color:#f59e0b;color:#2b1a00}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#eef2f6}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.lg{padding:13px 18px;font-size:14.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--primary);cursor:pointer;font-weight:600;padding:0}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-pend{background:#fff3dc;color:#9a5800}
.b-vb{background:#e5efff;color:#1d4ed8}
.b-dev{background:#f1e8ff;color:#6d28d9}
.b-ger{background:#dff5f2;color:#0f766e}
.b-ok{background:#e3f6e9;color:#15803d}
.b-na{background:#eef1f4;color:#5b6675}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,#dbe7f3 0,transparent 60%),var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 28px}
.brand-lg{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand-lg h1{font-size:19px} .brand-lg p{margin:2px 0 0;color:var(--muted);font-size:13px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;padding:10px 12px;border:1px solid #d3dbe5;border-radius:9px;background:#fff;outline:none;transition:.15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,79,128,.14)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0 10px}
.demo-users{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--primary);background:var(--primary-soft)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11.5px;color:#fff;flex:none}
.av-AP{background:#1d4f80}.av-SC{background:#6d28d9}.av-TG{background:#0f766e}.av-HL{background:#b45309}
.chip b{display:block;font-size:13px}.chip small{color:var(--muted);font-size:11.5px}
.login-foot{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.side-brand .logo{width:34px;height:34px;background:#2f6aa3}
.side-brand b{display:block;font-size:14.5px}.side-brand small{color:var(--side-ink);font-size:11.5px}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7189a3;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;color:var(--side-ink);border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500}
.nav-item:hover{background:var(--side-2);color:#fff}
.nav-item.active{background:#1f4466;color:#fff}
.nav-item span:first-of-type{flex:1}
.count{font-size:11px;font-weight:700;background:#24405d;color:#cfdbe8;padding:1px 8px;border-radius:999px}
.count.hot{background:#f59e0b;color:#2b1a00}
.side-foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:#7189a3;border-top:1px solid #1f3650}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:60px}
.topbar .who{display:flex;align-items:center;gap:10px;margin-left:auto}
.who-text{font-size:13px;line-height:1.3;text-align:right}
.who-text b{color:var(--ink)}
.fs-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#f8fafc;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-chip .led{width:8px;height:8px;border-radius:50%;background:#a3adba;flex:none}
.fs-chip.ok .led{background:var(--ok)} .fs-chip.warn{background:var(--warn-soft);border-color:#f6d7a8;color:#7a4300} .fs-chip.warn .led{background:#f59e0b}
.menu-btn{display:none}
.content{padding:24px;max-width:1280px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px}.page-head p{margin:4px 0 0;color:var(--muted)}

/* ---------- Tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:15px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{cursor:pointer;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:.15s;display:flex;flex-direction:column;gap:8px}
.stat:hover{border-color:#b9c8d9;transform:translateY(-1px)}
.stat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.stat.hot .ic{background:var(--warn-soft);color:var(--warn)}
.stat .n{font-size:26px;font-weight:800;line-height:1}
.stat .l{font-size:13px;font-weight:600;color:var(--ink-2)}
.stat .h{font-size:11.5px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.section-title h2{font-size:15.5px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);background:var(--warn-soft);border:1px solid #f6d7a8;color:#7a4300;margin-bottom:20px;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}
.banner.info{background:var(--primary-soft);border-color:#c9daec;color:#173f66}
.inbox-list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.inbox-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid #c9daec;border-left:4px solid var(--primary);border-radius:10px}
.inbox-item .grow{flex:1;min-width:0}
.inbox-item b{font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- Tabla ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:11px 14px;background:#f8fafc;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid #eef1f5;vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:.12s}
.tbl tbody tr:hover{background:#f6f9fc}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600}
.dots{display:inline-flex;gap:4px}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:800;border:1.5px solid #cfd7e1;color:#9aa5b3;background:#fff}
.dot.on{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.na{border-style:dashed;opacity:.5}
.empty{text-align:center;padding:42px 20px;color:var(--muted);background:#fff;border:1px dashed #d3dbe5;border-radius:var(--radius)}
.empty svg{width:34px;height:34px;color:#a8b4c3;margin-bottom:8px}

/* ---------- Timeline ---------- */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 0 14px 22px}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:2px;background:#e3e8ee}
.timeline li:last-child::before{display:none}
.timeline li::after{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.timeline li.ok::after{border-color:var(--ok);background:var(--ok)}
.timeline li.sys::after{border-color:#a3adba;width:10px;height:10px;left:1px}
.t-date{font-size:11.5px;color:var(--muted)}
.t-text{font-size:13px;font-weight:500}
.timeline li.sys .t-text{font-weight:400;color:var(--ink-2);font-size:12.5px}
.t-id{font-size:11.5px;color:var(--primary);font-weight:700}

/* ---------- Modales ---------- */
.backdrop{position:fixed;inset:0;background:rgba(12,24,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.modal-md{max-width:560px}.modal-sm{max-width:420px}.modal-xl{max-width:1180px}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px}
.modal-head .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.modal-head .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:#fafbfc}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.busy{position:fixed;inset:0;z-index:400;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:600;color:var(--ink-2)}
.spin{width:34px;height:34px;border:3px solid #d3dbe5;border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Vista documento ---------- */
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;overflow-y:auto;flex:1;background:#eef1f5}
.sheet-wrap{padding:22px;display:flex;justify-content:center}
.doc-side{background:#fff;border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
.side-card{border:1px solid var(--line);border-radius:10px;padding:14px}
.side-card h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.action-card{border-color:#c9daec;background:#f7fafd}
.action-card .btn{width:100%}
.action-card p{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.btn-row{display:flex;flex-direction:column;gap:8px}
.ger-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ger-opt{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700}
.ger-opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;align-items:center;gap:10px;font-size:13px}
.ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1.5px solid #cbd3dd;color:#9aa5b3;flex:none}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.checks .when{margin-left:auto;font-size:11.5px;color:var(--muted)}
.files li{font-size:12.5px}
.files .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Hoja A4 */
.a4{width:100%;max-width:640px;aspect-ratio:210/297;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08),0 12px 32px rgba(16,35,58,.12);display:flex;flex-direction:column;padding:4.2% 5%;position:relative;color:#1b2430}
.a4-head{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:6px 14px;padding-bottom:10px;border-bottom:2px solid #1b2430;font-size:11.5px}
.a4-head div span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:#6b7686}
.a4-head div b{font-size:12.5px}
.a4-head .stamp{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#6b7686}
.a4-body{flex:1;min-height:0;margin:12px 0;border:1px solid #e6eaef;border-radius:4px;overflow:hidden;background:#fbfcfd;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px}
.a4-body img{max-width:100%;max-height:100%;object-fit:contain}
.a4-body iframe{width:100%;height:100%;border:0;background:#fff}
.sim{width:100%;height:100%;padding:16px 18px;font-size:10.5px;display:flex;flex-direction:column;gap:12px;background:#fff;color:#1b2430}
.sim-top{display:flex;justify-content:space-between;gap:12px}
.sim-box{border:2px solid #b91c1c;color:#b91c1c;padding:8px 12px;text-align:center;font-weight:700;font-size:10.5px;line-height:1.5;flex:none}
.sim table{width:100%;border-collapse:collapse}
.sim th,.sim td{border-bottom:1px solid #e6eaef;padding:5px 4px;text-align:left}
.sim th{background:#f3f5f8;font-size:9.5px;text-transform:uppercase}
.sim .tot{margin-left:auto;width:55%}
.sim .tot td:last-child{text-align:right;font-weight:700}
.sim-note{margin-top:auto;text-align:center;color:#9aa5b3;font-style:italic;font-size:10px}

/* Zona de firmas – posiciones FIJAS */
.sig-zone{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid #1b2430;border-radius:4px;flex:none}
.sig-slot{display:flex;flex-direction:column;align-items:center;padding:8px 6px 8px;text-align:center;border-right:1px solid #cfd6df;min-width:0}
.sig-slot:last-child{border-right:0}
.sig-area{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:#1b2430}
.sig-img{height:62px;width:100%;display:flex;align-items:flex-end;justify-content:center;margin:4px 0 2px}
.sig-img img{max-height:100%;max-width:92%;object-fit:contain}
.sig-pend{font-size:10px;color:#a3adba;border:1px dashed #c9d1db;border-radius:4px;padding:4px 10px;margin-bottom:8px;font-style:italic}
.sig-line{width:82%;border-top:1px solid #1b2430;margin-bottom:3px}
.sig-name{font-size:11px;font-weight:800}
.sig-date{font-size:9.5px;color:#5b6675;min-height:13px}
.sig-slot.signed .sig-area::after{content:" ✓";color:var(--ok)}
.sig-slot.na{opacity:.5}
.sig-zone.solo{grid-template-columns:1fr;width:33.34%}   /* sin V°B°: solo la firma de Finanzas */

/* Firma */
.checker{background-color:#fff;background-image:linear-gradient(45deg,#f0f2f5 25%,transparent 25%),linear-gradient(-45deg,#f0f2f5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f0f2f5 75%),linear-gradient(-45deg,transparent 75%,#f0f2f5 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}
.sig-current{height:170px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;margin-bottom:12px;padding:12px}
.sig-current img{max-height:140px;max-width:100%}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #c4cfdc;border-radius:12px;padding:22px;text-align:center;cursor:pointer;color:var(--ink-2);background:#fafbfd}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop svg{width:28px;height:28px;color:var(--primary)}
.drop.locked{cursor:default;border-style:solid;border-color:#c9daec;background:var(--primary-soft)}
.sig-preview{height:140px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;margin-top:12px;color:var(--muted);font-size:12.5px}
.sig-preview img{max-height:120px;max-width:95%}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:4px;background:#eef2f6;padding:4px;border-radius:10px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#pad{width:100%;height:190px;border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:crosshair;background:#fff}
.tips{margin:12px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.tips li{margin-bottom:6px}

/* Carpetas */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 4px}
.flow .node{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:130px}
.flow .node b{font-size:12.5px}.flow .node small{color:var(--muted);font-size:11.5px}
.flow .node.final{border-color:#9fd5b2;background:var(--ok-soft)}
.flow .arrow{color:#a3adba;font-weight:700}
.flow .who{font-size:10.5px;font-weight:800;color:var(--primary);letter-spacing:.04em}

/* Buscador */
.search-hero{position:relative;margin-bottom:20px}
.search-hero svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted)}
.search-big{width:100%;font-size:17px;padding:17px 18px 17px 52px;border:1.5px solid #cdd6e1;border-radius:14px;background:#fff;box-shadow:var(--shadow);outline:none}
.search-big:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(29,79,128,.12)}
.detail{display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:16px;margin-bottom:20px}

.loc{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--primary-soft);border-radius:10px;font-weight:700;color:#173f66;margin-top:12px}

/* Toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:#13263c;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;font-size:13.5px;animation:up .2s}
.toast.ok{background:#14532d}.toast.warn{background:#78350f}.toast.error{background:#7f1d1d}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.overlay{display:none}
.lw{position:relative;display:inline-flex;flex:none}
.lw .brand-img{display:none;height:40px;max-width:120px;object-fit:contain;background:#fff;border-radius:8px;padding:4px 6px}
.lw.has-img .brand-img{display:block}.lw.has-img .logo{display:none}
.side-brand .lw .brand-img{height:34px;max-width:96px}
.back-link{display:flex;align-items:center;gap:8px;color:var(--side-ink);text-decoration:none;font-size:12.5px;padding:8px 10px;border-radius:8px;margin-bottom:8px}

.reg-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;padding:18px;overflow-y:auto;flex:1;min-height:0}

@media (max-width:900px){.reg-body{grid-template-columns:1fr}.reg-prev{position:static;height:65vh;min-height:360px}}
.done{text-align:center;padding:34px 26px 26px}

.done h2{font-size:21px;margin-bottom:8px}.done p{color:var(--ink-2);margin:0 0 20px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.qpos{font-size:11.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}

<script>
/* ---- Integración con el Portal de Finanzas MONFRUT ----
   Abierto desde el portal (/vb.html?emp=<id>&nom=<empresa>): la sesión es la del portal (sin claves propias),
   cada empresa usa su propia carpeta y su propio registro en este navegador. No se usa la base de datos (Neon):
   todo vive en la carpeta de la empresa (OneDrive) y en el navegador. */
const QS = new URLSearchParams(location.search);
const EMP = parseInt(QS.get('emp') || '0', 10) || 0;
const EMP_NOM = QS.get('nom') || '';
const EN_PORTAL = /^https?:$/.test(location.protocol);           // servido por el portal (no como archivo local)
const EN_MARCO = window.top !== window;                           // dentro de la página del portal
const SUF = EMP ? '_e' + EMP : '';
/* Usuario del portal -> rol del circuito. Se reconoce por el nombre o usuario (alvaro, santiago, thomas, hans).
   El usuario "admin" del portal firma como AP. Para casos especiales, agregar aquí:  'usuario_portal': 'SC'  */
const ROL_PORTAL = { admin: 'AP' };
/* =====================================================================
   CIRCUITO V°B° — PROTOTIPO (HTML + CSS + JS + localStorage + carpetas)
   ---------------------------------------------------------------------
   • Sin carpeta conectada: todo vive en localStorage (modo demo).
   • Con carpeta conectada (Chrome / Edge, File System Access API):
       - Se elige la carpeta raíz (ej. "SANTA ANA" en OneDrive).
       - Cada paso deja una COPIA del PDF firmado en su carpeta:
           DOCUMENTO INICIAL  -> original, nombre = ID (ej. 24350.pdf)
           FIRMADA POR AP     -> con firma AP
           FIRMADA POR SC     -> con firmas AP + SC
           FIRMA GERENTE      -> con firmas AP + SC + TG/HL
           FACTURAS FIRMADAS  -> versión final
         Sin V°B°:  DOCUMENTO INICIAL -> FIRMADA POR AP -> FACTURAS FIRMADAS
       - El registro (estado + historial) se guarda en _SISTEMA_VB/<ID>.json
         dentro de la misma carpeta, así otros usuarios con la carpeta
         sincronizada por OneDrive ven el mismo estado.
   • Las firmas se estampan sobre la PÁGINA 1 del PDF, en una franja inferior
     de posición FIJA (PDF_SIG), usando pdf-lib.
   Próximo paso (versión definitiva): backend + base de datos + login real.
   ===================================================================== */

/* Usuarios: se puede entrar con el nombre (alvaro) o con la sigla (AP).
   IMPORTANTE: este archivo es público en Vercel; NO escribir aquí las contraseñas reales del Maestro. */
const USERS = {
  AP: { login: 'alvaro',   nombre: 'Alvaro',   pw: '1234', rol: 'Finanzas',   area: 'FINANZAS',    slot: 'AP'  },
  SC: { login: 'santiago', nombre: 'Santiago', pw: '1234', rol: 'Subgerente', area: 'SUBGERENCIA', slot: 'SC'  },
  TG: { login: 'thomas',   nombre: 'Thomas',   pw: '1234', rol: 'Gerente',    area: 'GERENCIA',    slot: 'GER' },
  HL: { login: 'hans',     nombre: 'Hans',     pw: '1234', rol: 'Gerente',    area: 'GERENCIA',    slot: 'GER' }
};
const quien = u => USERS[u] ? `${USERS[u].nombre} (${u})` : u;           // "Alvaro (AP)"
const firmaNombre = u => USERS[u] ? `${USERS[u].nombre} · ${u}` : u;     // "Alvaro · AP"
const loginA = v => { v = String(v || '').trim().toLowerCase(); return Object.keys(USERS).find(k => k.toLowerCase() === v || USERS[k].login === v); };

/* Carpetas del circuito (nombres exactos de la carpeta compartida) */
const FOLDERS = {
  INICIAL: 'DOCUMENTO INICIAL',
  AP:      'FIRMADA POR AP',
  SC:      'FIRMADA POR SC',
  GER:     'FIRMA GERENTE',
  FINAL:   'FACTURAS FIRMADAS'
};
const SYS_DIR = '_SISTEMA_VB';

/* Posición FIJA de la franja de firmas en el PDF (puntos PDF; A4 = 595 x 842) */
const PDF_SIG = { page: 0, margin: 36, bottom: 40, height: 118 };

const ESTADOS = {
  NUEVO:         { label: 'PENDIENTE · Nuevo',    cls: 'b-pend', ubic: 'AP - FINANZAS (Documento inicial)' },
  POR_FIRMAR_AP: { label: 'PENDIENTE · Firma AP', cls: 'b-pend', ubic: 'AP - FINANZAS' },
  PENDIENTE_SC:  { label: 'EN V°B° · SC',         cls: 'b-vb',   ubic: 'SC - SUBGERENCIA' },
  DEVUELTO_AP:   { label: 'DEVUELTO · AP',        cls: 'b-dev',  ubic: 'AP - FINANZAS' },
  PENDIENTE_TG:  { label: 'EN GERENCIA · TG',     cls: 'b-ger',  ubic: 'TG - GERENCIA' },
  PENDIENTE_HL:  { label: 'EN GERENCIA · HL',     cls: 'b-ger',  ubic: 'HL - GERENCIA' },
  APROBADO:      { label: 'APROBADO',             cls: 'b-ok',   ubic: 'FACTURAS FIRMADAS' },
  NO_REQUIERE:   { label: 'SIN V°B°',             cls: 'b-na',   ubic: 'Archivo' }
};

const LS = { docs: 'vb_docs_v1' + SUF, firmas: 'vb_firmas_v1', session: 'vb_session_v1' + SUF };   // la firma (imagen) es de la persona, no de la empresa

/* ---------------- Utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowIso = () => new Date().toISOString();
const pad2 = n => String(n).padStart(2, '0');
const fmt = iso => { if (!iso) return ''; const d = new Date(iso); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const hhmm = iso => { const d = new Date(iso); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const clp = n => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(Number(n) || 0);
const safeName = s => String(s).trim().replace(/[\\/:*?"<>|]/g, '-');
const pdfName = d => safeName(d.id) + '.pdf';
const sinVB = d => d.requiereVB === false;

function load(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch (e) { return def; } }
function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { toast('No hay espacio suficiente en el almacenamiento local del navegador.', 'error'); return false; }
}

const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  inbox: '<path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  checkc: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  archive: '<path d="M3 4h18v4H3z"/><path d="M5 8v12h14V8"/><path d="M10 12h4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  logout: '<path d="M9 21H5V3h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  file: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
  print: '<path d="M6 9V3h12v6"/><path d="M6 18H4v-7h16v7h-2"/><path d="M8 14h8v7H8z"/>',
  upload: '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/>',
  download: '<path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v.5"/>',
  history: '<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.5"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/>',
  pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  folder: '<path d="M3 6a1 1 0 011-1h5l2 2h9a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/>',
  sync: '<path d="M21 12a9 9 0 01-15.5 6.2"/><path d="M3 12A9 9 0 0118.5 5.8"/><path d="M18 2v4h-4M6 22v-4h4"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v6H4V6h6"/>',
  book: '<path d="M4 4h10a4 4 0 014 4v12H8a4 4 0 01-4-4z"/><path d="M4 16a4 4 0 014-4h10"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;
/* Integrado en el sitio "Maestro de Proveedores": usa su logo (/logo.png) y enlaza de vuelta. Abierto como archivo local, muestra el logo V°B°. */
const EN_SITIO = /^https?:$/.test(location.protocol);
const brandLogo = () => `<span class="lw">${EN_SITIO ? `<img class="brand-img" src="/logo.png" alt="MONFRUT" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">` : ''}<span class="logo">V°B°</span></span>`;
const backLink = () => EN_SITIO && !EN_MARCO ? `<a class="back-link" href="/">← Portal de Finanzas</a>` : '';

/* ================================================================
   CARPETAS (File System Access API) — persistencia del handle en IndexedDB
   ================================================================ */
/* IndexedDB (cientos de MB disponibles): kv = ajustes, docs = registro de documentos, sigs = imágenes de firma */
let _db = null;
function idbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('vb-fs' + SUF, 2);   // un registro por empresa
    r.onupgradeneeded = () => { for (const n of ['kv', 'docs', 'sigs']) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
    r.onsuccess = () => { _db = r.result; res(_db); }; r.onerror = () => rej(r.error);
  });
}
async function idbGet(k, st = 'kv') { const db = await idbOpen(); return new Promise(res => { const q = db.transaction(st).objectStore(st).get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
async function idbSet(k, v, st = 'kv') { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction(st, 'readwrite'); t.objectStore(st).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbDel(k, st = 'kv') { const db = await idbOpen(); return new Promise(res => { const t = db.transaction(st, 'readwrite'); t.objectStore(st).delete(k); t.oncomplete = res; t.onerror = res; }); }
async function idbAll(st) { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction(st).objectStore(st).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); }
async function idbPutMany(st, items) { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction(st, 'readwrite'), o = t.objectStore(st); items.forEach(d => o.put(d, d.id)); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbClear(st) { const db = await idbOpen(); return new Promise(res => { const t = db.transaction(st, 'readwrite'); t.objectStore(st).clear(); t.oncomplete = res; t.onerror = res; }); }

const FS = {
  supported: typeof window.showDirectoryPicker === 'function',
  root: null,
  status: 'none',          // none | needs-permission | ready | unsupported
  lastSync: null,
  inbox: [],               // archivos en DOCUMENTO INICIAL sin registrar
  counts: {},
  sig: '',
  ready() { return this.status === 'ready' && !!this.root; },

  async init() {
    if (!this.supported) { this.status = 'unsupported'; return; }
    try {
      const h = await idbGet('root'); if (!h) return;
      this.root = h;
      const p = h.queryPermission ? await h.queryPermission({ mode: 'readwrite' }) : 'granted';
      this.status = p === 'granted' ? 'ready' : 'needs-permission';
      if (this.ready()) await this.sync(true);
    } catch (e) { this.status = 'none'; }
  },
  async connect() {
    const h = await window.showDirectoryPicker({ id: 'vb-root' + SUF, mode: 'readwrite' });
    await this.use(h);
  },
  async use(h) {
    if (EMP_NOM && !carpetaEsDeEmpresa(h.name)) toast(`Ojo: la carpeta "${h.name}" no parece ser de ${EMP_NOM}. Revisa que sea la carpeta correcta.`, 'error');
    this.root = h; this.status = 'ready';
    try { await idbSet('root', h); } catch (e) { /* algunos handles (OPFS) no se pueden guardar */ }
    for (const f of Object.values(FOLDERS)) await h.getDirectoryHandle(f, { create: true });
    await h.getDirectoryHandle(SYS_DIR, { create: true });
    await this.sync();
    toast(`Carpeta "${h.name}" conectada.`, 'ok');
  },
  async reconnect() {
    if (!this.root) return this.connect();
    const p = await this.root.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') { this.status = 'ready'; await this.sync(); toast('Carpeta reconectada.', 'ok'); }
  },
  async disconnect() { await idbDel('root'); this.root = null; this.status = this.supported ? 'none' : 'unsupported'; this.inbox = []; render(); },
  async dir(name) { let d = this.root; for (const part of name.split('/')) d = await d.getDirectoryHandle(part, { create: true }); return d; },
  async sigDir() { return this.dir(SYS_DIR + '/_firmas'); },
  rc: {},   // caché de registros leídos: nombre -> { t: lastModified, d: doc }
  async writeFile(folder, name, data) {
    const fh = await (await this.dir(folder)).getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(data); await w.close();
  },
  async readFile(folder, name) { return (await (await this.dir(folder)).getFileHandle(name)).getFile(); },
  async list(folder) {
    const out = [], d = await this.dir(folder);
    for await (const [n, h] of d.entries()) if (h.kind === 'file' && !n.startsWith('~$') && !n.startsWith('.')) out.push(n);
    return out.sort();
  },
  async saveDoc(doc) { await this.writeFile(SYS_DIR, safeName(doc.id) + '.json', JSON.stringify(doc, null, 1)); },

  /* Mueve documentos creados en modo local hacia la carpeta */
  async pushLocal(d) {
    if (d.archivo && d.archivo.data) {
      const ext = d.archivo.type === 'pdf' ? 'pdf' : 'jpg';
      const name = `${safeName(d.id)}.${ext}`;
      const blob = await (await fetch(d.archivo.data)).blob();
      await this.writeFile(FOLDERS.INICIAL, name, blob);
      d.archivo = { name, type: d.archivo.type, folder: 'INICIAL' };
      d.archivos = { ...(d.archivos || {}), INICIAL: { name, fecha: nowIso() } };
    }
    await this.saveDoc(d);
  },

  /* Sincroniza registro local <-> carpeta. La versión con más historial gana. */
  async sync(silent) {
    if (!this.ready()) return;
    try {
      const remote = {}, sys = await this.dir(SYS_DIR);
      for await (const [n, h] of sys.entries()) {
        if (h.kind !== 'file' || !n.endsWith('.json')) continue;
        try {
          const f = await h.getFile(), c = this.rc[n];
          if (c && c.t === f.lastModified) { remote[c.d.id] = c.d; continue; }   // sin cambios: no se vuelve a leer
          const d = JSON.parse(await f.text()); if (d && d.id) { normalizeDoc(d); remote[d.id] = d; this.rc[n] = { t: f.lastModified, d }; }
        } catch (e) { }
      }
      try { await SIGS.syncFolder(); } catch (e) { }
      const map = {}; Store.docs().forEach(d => map[d.id] = JSON.parse(JSON.stringify(d)));
      let changed = false;
      for (const id in remote) if (!map[id] || newer(remote[id], map[id])) { map[id] = remote[id]; changed = true; }
      for (const id in map) if (!remote[id] || newer(map[id], remote[id])) { await this.pushLocal(map[id]); changed = true; }
      if (changed) Store.replaceAll(Object.values(map));

      const all = Object.values(map);
      const used = new Set(all.filter(d => d.archivo && d.archivo.folder).map(d => d.archivo.name));
      this.inbox = (await this.list(FOLDERS.INICIAL))
        .filter(n => /\.(pdf|jpe?g|png)$/i.test(n) && !used.has(n) && !map[n.replace(/\.[^.]+$/, '')]);
      for (const k in FOLDERS) this.counts[k] = (await this.list(FOLDERS[k])).filter(n => /\.(pdf|jpe?g|png)$/i.test(n)).length;
      try {
        for await (const [n, h] of this.root.entries()) {
          if (h.kind !== 'file' || !LIBRO_RX.test(n) || n.startsWith('~$')) continue;
          const f = await h.getFile();
          if (!LIBRO.meta || LIBRO.meta.file !== n || LIBRO.meta.mtime !== f.lastModified) {
            const m = await LIBRO.fromFile(f, 'carpeta'); changed = true;
            toast(`Libro de compras leído: ${m.rows} comprobantes (hasta N° ${m.maxCompte}).`, 'ok');
          }
          break;
        }

function carpetaEsDeEmpresa(n) { const a = norm(n), b = norm(EMP_NOM); return !!a && (b.includes(a) || a.includes(b)); }
function newer(a, b) {

/* ================================================================
   LIBRO DE COMPRAS (Excel) — enlace por N° de comprobante (# Compte)
   Se lee automáticamente si en la carpeta raíz existe un archivo
   "LIBRO DE COMPRAS.xlsx" (o se carga a mano). Índice guardado en IndexedDB.
   ================================================================ */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }
const norm = v => String(v ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const LIBRO_RX = /libro.*compras.*\.xls[xm]?$/i;
const LIBRO = {
  meta: null, rows: {},
  async init() { try { const v = await idbGet('libro'); if (v) { this.meta = v.meta; this.rows = v.rows; } } catch (e) { } },
  loaded() { return !!this.meta; },
  get(c) {
    const r = this.rows[String(c ?? '').trim()]; if (!r) return null;
    const [rut, nombre, docto, fDocto, fVencto, fCompte, glosa, cargos, abonos] = r;
    return { compte: String(c).trim(), rut, nombre, docto, fDocto, fVencto, fCompte, glosa, cargos, abonos, monto: abonos || cargos };
  },
  async lib() {
    if (window.XLSX) return;
    for (const src of ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']) {
      try { await loadScript(src); if (window.XLSX) return; } catch (e) { }
    }
    throw new Error('No se pudo cargar el lector de Excel (revisa la conexión a internet).');
  },
  async fromFile(file, origen) {
    await this.lib();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let a = null, hi = -1, sheet = '';
    for (const sn of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null });
      const i = rows.slice(0, 30).findIndex(r => r && r.some(c => norm(c) === '# compte'));
      if (i >= 0) { a = rows; hi = i; sheet = sn; break; }
    }
    if (!a) throw new Error('No se encontró la columna "# Compte" en el Excel.');
    const H = a[hi].map(norm);
    const col = (...names) => { for (const n of names) { const i = H.indexOf(n); if (i >= 0) return i; } for (const n of names) { const i = H.findIndex(h => h.includes(n)); if (i >= 0) return i; } return -1; };
    const C = { rut: col('analisis', 'rut'), nombre: col('nombre o razon social', 'razon social', 'nombre'), docto: col('# docto'), fDocto: col('fecha docto'), fVencto: col('fecha vencto'),
      compte: col('# compte'), fCompte: col('fecha compte'), glosa: col('glosa operacion', 'glosa'), cargos: col('cargos'), abonos: col('abonos') };
    const clean = v => String(v ?? '').replace(/^'+/, '').trim();
    const fecha = v => { if (v == null || v === '') return ''; if (typeof v === 'number') return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000).toISOString().slice(0, 10); const d = new Date(v); return isNaN(d) ? String(v) : d.toISOString().slice(0, 10); };
    const num = v => Number(String(v ?? 0).replace(/[^\d.-]/g, '')) || 0;
    const rows = {}; let n = 0, maxC = 0, maxF = '';
    for (let i = hi + 1; i < a.length; i++) {
      const r = a[i]; if (!r) continue;
      const c = clean(r[C.compte]); if (!c) continue;
      const fc = fecha(r[C.fCompte]);
      rows[c] = [clean(r[C.rut]).replace(/\/\d+$/, ''), clean(r[C.nombre]), clean(r[C.docto]), fecha(r[C.fDocto]), fecha(r[C.fVencto]), fc, clean(r[C.glosa]), num(r[C.cargos]), num(r[C.abonos])];
      n++; if (Number(c) > maxC) maxC = Number(c); if (fc > maxF) maxF = fc;
    }
    this.rows = rows;
    this.meta = { file: file.name, mtime: file.lastModified, rows: n, maxCompte: maxC, maxFecha: maxF, sheet, origen, cargado: nowIso() };
    try { await idbSet('libro', { meta: this.meta, rows }); } catch (e) { }
    return this.meta;
  },
  async clear() { this.meta = null; this.rows = {}; await idbDel('libro'); }
};
const fdate = s => s ? s.split('-').reverse().join('/') : '';
function libroResumen(l) {
  return `<b>${esc(l.nombre)}</b> · RUT ${esc(l.rut)}<br>Docto N° <b>${esc(l.docto)}</b> · ${fdate(l.fDocto)} · ${clp(l.monto)}<br><span class="muted">${esc(l.glosa)}</span>`;

/* ---------------- Store ---------------- */
/* Firmas usadas en documentos: se guardan UNA vez (no se repiten dentro de cada documento).
   Copia en IndexedDB y en la carpeta: _SISTEMA_VB/_firmas/<id>.png */
const SIGS = {
  cache: {},
  id(user, img) { let h = 0x811c9dc5; for (let i = 0; i < img.length; i++) { h ^= img.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return `${user}-${h.toString(16)}`; },
  async init() { try { (await idbAll('sigs')).forEach(x => { if (x && x.id) this.cache[x.id] = x.img; }); } catch (e) { } },
  put(id, img) { if (this.cache[id]) return; this.cache[id] = img; idbSet(id, { id, img }, 'sigs').catch(() => { }); },
  img(f) { return f ? (f.img || this.cache[f.sig] || '') : ''; },
  async ensure(f) {
    if (!f || f.img || this.cache[f.sig] || !FS.ready()) return;
    try { const file = await (await FS.sigDir()).getFileHandle(f.sig + '.png').then(h => h.getFile()); this.put(f.sig, await readFile(file)); } catch (e) { }
  },
  /* Sube a la carpeta las firmas que falten y baja las que no estén en este navegador */
  async syncFolder() {
    const dir = await FS.sigDir(), there = new Set();
    for await (const [n, h] of dir.entries()) {
      if (h.kind !== 'file' || !n.endsWith('.png')) continue;
      const id = n.slice(0, -4); there.add(id);
      if (!this.cache[id]) this.put(id, await readFile(await h.getFile()));
    }
    for (const id in this.cache) if (!there.has(id)) await FS.writeFile(SYS_DIR + '/_firmas', id + '.png', await (await fetch(this.cache[id])).blob());
  }
};
/* Saca las imágenes de firma de dentro del documento (formato antiguo) y deja solo la referencia */
function normalizeDoc(d) {
  for (const k in (d.firmas || {})) { const f = d.firmas[k]; if (f && f.img) { const id = SIGS.id(f.user, f.img); SIGS.put(id, f.img); delete f.img; f.sig = id; } }
  return d;
}
const BC = 'BroadcastChannel' in window ? new BroadcastChannel('vb-docs' + SUF) : null;

const Store = {
  _docs: [], _map: {},
  async init() {
    let list = [];
    try { list = await idbAll('docs'); } catch (e) { }
    const legacy = load(LS.docs, null);          // migración desde la versión anterior (localStorage)
    if (legacy && legacy.length) {
      const m = {}; list.forEach(d => m[d.id] = d);
      legacy.forEach(d => { if (!m[d.id] || newer(d, m[d.id])) m[d.id] = d; });
      list = Object.values(m);
    }
    list.forEach(normalizeDoc); this._set(list);
    if (legacy) { try { await idbPutMany('docs', list); localStorage.removeItem(LS.docs); } catch (e) { } }
  },
  _set(list) {
    this._docs = list.sort((a, b) => (b.creado || '').localeCompare(a.creado || ''));
    this._map = {}; list.forEach(d => this._map[d.id] = d);
  },
  async reload() { try { const l = await idbAll('docs'); l.forEach(normalizeDoc); this._set(l); } catch (e) { } },
  docs() { return this._docs; },                                   // solo lectura
  get(id) { const d = this._map[id]; return d ? JSON.parse(JSON.stringify(d)) : undefined; },   // copia para modificar
  upsert(doc) {
    normalizeDoc(doc);
    if (this._map[doc.id]) this._docs[this._docs.findIndex(d => d.id === doc.id)] = doc; else this._docs.unshift(doc);
    this._map[doc.id] = doc;
    idbSet(doc.id, doc, 'docs').then(() => BC && BC.postMessage('upd')).catch(e => toast('No se pudo guardar en el navegador: ' + e.message, 'error'));
    if (FS.ready()) FS.saveDoc(doc).catch(e => toast('No se pudo guardar el registro en la carpeta: ' + e.message, 'error'));
    return true;
  },
  replaceAll(list) { list.forEach(normalizeDoc); this._set(list); idbPutMany('docs', list).then(() => BC && BC.postMessage('upd')).catch(() => { }); },
  async clear() { this._set([]); await idbClear('docs'); },
  firmas() { return load(LS.firmas, {}); },
  firma(u) { return this.firmas()[u] || null; },
  setFirma(u, img) { const f = this.firmas(); f[u] = { img, fecha: nowIso() }; return save(LS.firmas, f); }
};

/* ================================================================
   PDF: obtener original, estampar firmas (pdf-lib)
   ================================================================ */
async function getOriginal(d) {
  if (!d.archivo) throw new Error('El documento no tiene archivo adjunto.');
  if (d.archivo.folder) {
    if (!FS.ready()) throw new Error('Conecta la carpeta para leer el archivo original.');
    const f = await FS.readFile(FOLDERS.INICIAL, d.archivo.name);
    return { bytes: await f.arrayBuffer(), type: d.archivo.type, mime: f.type || (d.archivo.type === 'pdf' ? 'application/pdf' : 'image/jpeg') };
  }
  const r = await fetch(d.archivo.data);
  return { bytes: await r.arrayBuffer(), type: d.archivo.type, mime: d.archivo.data.slice(5, d.archivo.data.indexOf(';')) };
}
const winAnsi = s => String(s ?? '').replace(/[^\x20-\x7E -ÿ]/g, '?');

async function drawSigStrip(pdf, d) {
  const { StandardFonts, rgb } = PDFLib;
  const page = pdf.getPage(Math.min(PDF_SIG.page, pdf.getPageCount() - 1));
  // La hoja se ALARGA hacia abajo: el documento original queda intacto y la franja de firmas va en el espacio nuevo,
  // como una extensión de la misma página (no tapa nada del documento).
  const mb = page.getMediaBox(), EXT = PDF_SIG.height + 34;
  const giro = ((page.getRotation().angle % 360) + 360) % 360;
  let base = mb.y + PDF_SIG.bottom, width = mb.width, xIni = mb.x;
  if (giro === 0) {
    page.setMediaBox(mb.x, mb.y - EXT, mb.width, mb.height + EXT);
    page.setCropBox(mb.x, mb.y - EXT, mb.width, mb.height + EXT);
    base = mb.y - EXT + 10;
  }
  const font = await pdf.embedFont(StandardFonts.Helvetica), bold = await pdf.embedFont(StandardFonts.HelveticaBold);
  const slots = [{ k: 'AP', t: 'FINANZAS', who: firmaNombre('AP') }, { k: 'SC', t: 'SUBGERENCIA', who: firmaNombre('SC') }, { k: 'GER', t: 'GERENCIA', who: d.firmas.GER ? firmaNombre(d.firmas.GER.user) : (d.gerente ? firmaNombre(d.gerente) : 'TG / HL') }]
    .filter(s => !sinVB(d) || s.k === 'AP' || d.firmas[s.k]);   // sin V°B°: solo la firma de Finanzas (no se muestran casillas vacías)
  const x0 = xIni + PDF_SIG.margin, y0 = base, cw = (width - 2 * PDF_SIG.margin) / 3, W = cw * slots.length, H = PDF_SIG.height;
  const ink = rgb(0.1, 0.14, 0.19), gray = rgb(0.45, 0.49, 0.55), green = rgb(0.08, 0.5, 0.24);
  if (giro === 0) page.drawLine({ start: { x: xIni + 14, y: mb.y }, end: { x: xIni + width - 14, y: mb.y }, thickness: 0.4, color: gray, dashArray: [3, 3] });   // borde original de la hoja
  const center = (txt, f, size, cx, y, color) => { txt = winAnsi(txt); page.drawText(txt, { x: cx - f.widthOfTextAtSize(txt, size) / 2, y, size, font: f, color }); };

  page.drawText(winAnsi(`CIRCUITO V°B° · COMP. ${d.id} · ${d.proveedor} · Factura ${d.factura}${d.oc ? ' · OC ' + d.oc : ''}${sinVB(d) ? ' · SIN V°B° (solo firma Finanzas)' : ''}`), { x: x0, y: y0 + H + 5, size: 7, font: bold, color: gray });
  page.drawRectangle({ x: x0, y: y0, width: W, height: H, borderColor: ink, borderWidth: 1 });
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i], cx = x0 + i * cw, mid = cx + cw / 2, f = d.firmas[s.k], na = !f && sinVB(d) && s.k !== 'AP';
    if (i > 0) page.drawLine({ start: { x: cx, y: y0 + 6 }, end: { x: cx, y: y0 + H - 6 }, thickness: 0.5, color: gray });
    center(s.t, bold, 8, mid, y0 + H - 14, f ? green : ink);
    const boxW = cw - 24, boxH = H - 58, boxY = y0 + 36;
    if (f) {
      await SIGS.ensure(f);
      if (!SIGS.img(f)) throw new Error('No se encontró la imagen de la firma de ' + f.user + '. Sincroniza la carpeta.');
      const img = await pdf.embedPng(SIGS.img(f));
      const sc = Math.min(boxW / img.width, boxH / img.height);
      page.drawImage(img, { x: mid - img.width * sc / 2, y: boxY, width: img.width * sc, height: img.height * sc });
    } else center(na ? 'NO REQUIERE V°B°' : 'pendiente', font, 7, mid, boxY + boxH / 2, gray);
    page.drawLine({ start: { x: cx + 18, y: y0 + 32 }, end: { x: cx + cw - 18, y: y0 + 32 }, thickness: 0.7, color: ink });
    center(na ? '-' : s.who, bold, 8.5, mid, y0 + 20, ink);
    if (f) center(fmt(f.fecha), font, 7, mid, y0 + 9, gray);
  }
}

async function buildStamped(d) {
  if (!window.PDFLib) throw new Error('No se pudo cargar la librería PDF (revisa la conexión a internet).');
  const { PDFDocument } = PDFLib;
  const o = await getOriginal(d);
  let pdf;
  if (o.type === 'pdf') pdf = await PDFDocument.load(o.bytes, { ignoreEncryption: true });
  else {
    pdf = await PDFDocument.create();
    const page = pdf.addPage([595.28, 841.89]);
    const img = /png/.test(o.mime) ? await pdf.embedPng(o.bytes) : await pdf.embedJpg(o.bytes);
    const area = { x: 36, y: 36, w: 523 }; area.h = 841.89 - 36 - area.y;   // la franja de firmas va en la extensión inferior
    const s = Math.min(area.w / img.width, area.h / img.height);
    page.drawImage(img, { x: area.x + (area.w - img.width * s) / 2, y: area.y + area.h - img.height * s, width: img.width * s, height: img.height * s });
  }

}

/* ================================================================
   COLA DE TRABAJO: siguiente documento automático + llegadas
   ================================================================ */
function myQueue() {
  if (!me()) return [];
  const bands = bandejasDe(me()).filter(b => b.accion);
  return Store.docs().filter(d => bands.some(b => b.f(d)))
    .sort((a, b) => (state.skipped.has(a.id) - state.skipped.has(b.id)) || (a.actualizado || '').localeCompare(b.actualizado || ''));
}
const inboxFor = () => me() === 'AP' ? FS.inbox : [];
function updateTitle() {
  const n = myQueue().length + inboxFor().length;
  document.title = (n ? `(${n}) ` : '') + 'Circuito V°B° · MONFRUT';
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.08, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.35);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.35); } catch (e) { }
}
const modalBusy = () => [...document.querySelectorAll('.backdrop')].some(b => b.dataset.key !== 'done');

/* Al iniciar sesión: abre de inmediato lo pendiente */
function startQueue() {
  if (!me()) return;
  state.started = true; state.known = new Set(); state.knownFiles = new Set(inboxFor()); state.skipped = new Set();
  const q = myQueue(); q.forEach(d => state.known.add(d.id)); updateTitle();
  if (q.length) { openDoc(q[0].id); toast(`Tienes ${q.length} documento${q.length > 1 ? 's' : ''} pendiente${q.length > 1 ? 's' : ''}.`); }
  else if (inboxFor().length) { openNewDocModal(inboxFor()[0]); toast(`${inboxFor().length} archivo(s) en ${FOLDERS.INICIAL} por registrar.`); }
  else toast('No tienes documentos pendientes. Te avisaré cuando llegue uno.');
}
/* Después de firmar: sigue con el mismo documento si aún requiere acción; si no, abre el siguiente */
function afterAction(id, msg) {
  if (myQueue().some(x => x.id === id)) { refreshDocModal(); if (msg) toast(msg, 'ok'); updateTitle(); return; }
  goNext(msg, id);
}
function goNext(msg, exceptId) {
  const q = myQueue().filter(x => x.id !== exceptId); q.forEach(d => state.known.add(d.id)); updateTitle();
  if (q.length) {
    openDoc(q[0].id);
    toast(`${msg ? msg + ' ' : ''}Siguiente: Comp. ${q[0].id} · quedan ${q.length}.`, 'ok'); return;
  }
  closeModal('doc');
  if (inboxFor().length) { if (msg) toast(msg, 'ok'); openNewDocModal(inboxFor()[0]); toast(`Siguiente: registrar ${inboxFor()[0]} (${inboxFor().length} en ${FOLDERS.INICIAL}).`); return; }
  showAllDone(msg);
}
function showAllDone(msg) {
  closeModal('doc');
  openModal('done', `<div class="modal modal-sm"><div class="done">
    <div class="done-ic">${icon('check')}</div>
    <h2>¡Todo firmado por el momento!</h2>
    <p>${msg ? esc(msg) + '<br>' : ''}No tienes documentos pendientes. Cuando llegue uno nuevo se abrirá automáticamente.</p>
    <button class="btn primary lg block" data-act="close" data-key="done">Entendido</button></div></div>`);
}
/* Llegadas: documentos que entran a mi bandeja (sincronización de carpeta u otra pestaña) */
function checkArrivals() {
  if (!me() || !state.started) return;
  const q = myQueue(), nuevos = q.filter(d => !state.known.has(d.id));
  q.forEach(d => state.known.add(d.id));
  const files = inboxFor().filter(n => !state.knownFiles.has(n)); inboxFor().forEach(n => state.knownFiles.add(n));
  updateTitle();
  if (!nuevos.length && !files.length) return;
  beep();
  if (nuevos.length) {
    const txt = nuevos.length === 1 ? `Llegó un documento: Comp. ${nuevos[0].id} (${nuevos[0].proveedor})` : `Llegaron ${nuevos.length} documentos nuevos`;
    if (!modalBusy()) { closeModal('done'); openDoc(nuevos[0].id); toast(txt, 'ok'); }
    else toast(txt + ' · se abrirá al terminar el actual.', 'ok');
  } else if (files.length) {
    const txt = `Nuevo archivo en ${FOLDERS.INICIAL}: ${files[0]}`;
    if (!modalBusy()) { closeModal('done'); openNewDocModal(files[0]); toast(txt, 'ok'); }
    else toast(txt, 'ok');
  }
}

/* ================================================================
   FLUJO (máquina de estados). Si hay archivo + carpeta, primero se
   genera y guarda el PDF firmado; si falla, el estado NO cambia.
   ================================================================ */
function requireFirma(u) {
  if (Store.firma(u)) return true;
  toast('Primero debes cargar tu firma.', 'warn'); openFirmaModal(); return false;
}
async function transition(id, fn, outFolders, okMsg) {
  const d = Store.get(id); if (!d) return;
  if (fn(d) === false) { toast('Acción no permitida en el estado actual.', 'error'); return; }
  const useFolder = outFolders && outFolders.length && d.archivo && (d.archivo.folder || FS.ready());
  if (useFolder) {
    if (!FS.ready()) { toast('Reconecta la carpeta para guardar el PDF firmado.', 'warn'); return; }
    busy('Generando PDF firmado y guardando en carpeta…');
    try {
      const bytes = await buildStamped(d), name = pdfName(d), t = nowIso();
      d.archivos = d.archivos || {};
      for (const k of outFolders) {
        await FS.writeFile(FOLDERS[k], name, new Blob([bytes], { type: 'application/pdf' }));
        d.archivos[k] = { name, fecha: t };
        hist(d, 'SISTEMA', `PDF guardado en ${FOLDERS[k]}/${name}`, t);
      }
    } catch (e) { busy(); toast('No se pudo generar o guardar el PDF firmado: ' + e.message, 'error'); return; }
    busy();
  }
  if (Store.upsert(d)) { render(); afterAction(d.id, okMsg); if (FS.ready()) FS.sync(true); }
}
function sign(d, u, slot) {
  const t = nowIso(), img = Store.firma(u).img, id = SIGS.id(u, img);
  SIGS.put(id, img); if (FS.ready()) fetch(img).then(r => r.blob()).then(b => FS.writeFile(SYS_DIR + '/_firmas', id + '.png', b)).catch(() => { });
  d.firmas[slot] = { user: u, sig: id, fecha: t }; return t;
}

const Flow = {
  'enviar-vb': id => transition(id, d => {
    if (me() !== 'AP' || d.estado !== 'NUEVO') return false;
    d.requiereVB = true; d.estado = 'POR_FIRMAR_AP'; hist(d, 'AP', 'AP seleccionó documento para V°B°');
  }),
  'no-req': id => confirmBox('Este documento NO requiere V°B°: solo llevará la firma de AP y quedará en FACTURAS FIRMADAS.', () => transition(id, d => {

    d.requiereVB = false; d.estado = 'POR_FIRMAR_AP'; hist(d, 'AP', 'AP indicó que NO REQUIERE V°B° (solo firma AP)');
  }), 'Continuar'),
  'firmar-ap': id => { if (!requireFirma('AP')) return; transition(id, d => {

  }, ['AP'], 'Firmado y enviado a SC.'); },
  'firmar-ap-final': id => { if (!requireFirma('AP')) return; transition(id, d => {

  'vb-sc': id => { if (!requireFirma('SC')) return; transition(id, d => {

  'enviar-ger': id => { const g = state.pickG; if (!g) return; transition(id, d => {

  }, null, `Documento enviado a ${quien(g)} · Gerencia.`); },
  'firmar-ger': id => { const u = me(); if (!requireFirma(u)) return; transition(id, d => {
    if (d.estado !== 'PENDIENTE_' + u) return false;
    const t = sign(d, u, 'GER'); hist(d, u, `${u} firmó documento`, t); hist(d, 'SISTEMA', 'DOCUMENTO APROBADO', t);
    d.estado = 'APROBADO';

};

/* Lee el texto del PDF (pdf.js) y busca el N° de Orden de Compra */
async function pdfText(file) {
  if (!window.pdfjsLib) {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await loadScript(base + 'pdf.min.js');
    try { const w = await (await fetch(base + 'pdf.worker.min.js')).blob(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(w); }
    catch (e) { pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; }
  }
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let txt = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 4); i++) txt += ' ' + (await (await pdf.getPage(i)).getTextContent()).items.map(t => t.str).join(' ');
  return txt.replace(/\s+/g, ' ');
}
async function detectOC(file) {
  try {
    const t = await pdfText(file), found = [];
    if (t.replace(/\s/g, '').length < 20) return { scanned: true, ocs: [] };
    const rx = [/ORDEN\s*(?:DE\s*)?COMPRA\s*(?:N\s*[°º.o]?|NRO\.?|NUM\.?|#)?\s*:?\s*(\d{2,})/gi, /\bO\.?\s?C\.?\s*(?:N\s*[°º.o]?|NRO\.?|#)\s*:?\s*(\d{2,})/gi, /\bOC\s*:?\s*(\d{3,})/g];
    for (const r of rx) for (const m of t.matchAll(r)) if (!found.includes(m[1])) found.push(m[1]);
    return { ocs: found.slice(0, 3) };
  } catch (e) { return { ocs: [] }; }
}

/* ---------------- Procesamiento de archivos (modo local) ---------------- */
const readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo leer la imagen.')); i.src = src; });

async function processDocFile(file) {
  if (file.type === 'application/pdf') {
    if (file.size > 15 * 1024 * 1024) throw new Error('El PDF supera 15 MB (límite sin carpeta). Conecta una carpeta para archivos grandes.');
    return { name: file.name, type: 'pdf', data: await readFile(file) };
  }
  const img = await loadImg(await readFile(file));
  const s = Math.min(1, 1400 / img.width);
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return { name: file.name, type: 'img', data: c.toDataURL('image/jpeg', 0.82) };
}

function trimCanvas(c) {
  const x = c.getContext('2d'), { width: w, height: h } = c, d = x.getImageData(0, 0, w, h).data;
  let t = h, l = w, r = -1, b = -1;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) if (d[(y * w + i) * 4 + 3] > 10) { if (y < t) t = y; if (y > b) b = y; if (i < l) l = i; if (i > r) r = i; }
  if (r < 0) return null;
  const p = 6, o = document.createElement('canvas');
  o.width = r - l + 1 + p * 2; o.height = b - t + 1 + p * 2;
  o.getContext('2d').drawImage(c, l, t, r - l + 1, b - t + 1, p, p, r - l + 1, b - t + 1);
  return o;
}
async function processSignature(file, removeWhite) {
  if (!/^image\/(png|jpeg)$/.test(file.type)) throw new Error('La firma debe ser PNG o JPG.');
  const img = await loadImg(await readFile(file));
  const s = Math.min(1, 700 / img.width, 300 / img.height);
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
  if (removeWhite) {
    const id = x.getImageData(0, 0, c.width, c.height), p = id.data;
    for (let i = 0; i < p.length; i += 4) {
      const m = Math.min(p[i], p[i + 1], p[i + 2]);
      if (m > 225) p[i + 3] = 0; else if (m > 175) p[i + 3] = Math.round(p[i + 3] * (225 - m) / 50);
    }
    x.putImageData(id, 0, 0);
  }
  const t = trimCanvas(c); if (!t) throw new Error('La imagen parece estar vacía.');
  return t.toDataURL('image/png');
}

  drop.addEventListener('drop', e => e.dataTransfer.files[0] && handleFile(e.dataTransfer.files[0]));

  const pad = $('#pad'), ctx = pad.getContext('2d'); let down = false;
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b2a5b';
  const pos = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
  pad.addEventListener('pointerdown', e => { down = true; pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
  pad.addEventListener('pointermove', e => { if (!down) return; ctx.lineTo(...pos(e)); ctx.stroke(); drawn = true; saveBtn.disabled = false; });
  pad.addEventListener('pointerup', () => { down = false; });
  $('#padClear').addEventListener('click', () => { ctx.clearRect(0, 0, pad.width, pad.height); drawn = false; saveBtn.disabled = true; });

  document.querySelectorAll('.tab[data-tab]').forEach(t => t.addEventListener('click', () => {
    mode = t.dataset.tab;

    saveBtn.disabled = mode === 'up' ? !pending : !drawn;
  }));

  saveBtn.addEventListener('click', () => {
    let img = pending;
    if (mode === 'draw') { const t = trimCanvas(pad); if (!t) return; img = t.toDataURL('image/png'); }
    if (!img) return;
    if (Store.setFirma(u, img)) { firmaAlPortal(img); closeModal('firma'); toast('Firma guardada. Se usará automáticamente.', 'ok'); render(); refreshDocModal(); }
  });
}

    case 'download': downloadStamped(id); break;
    case 'open-file': openFolderFile(el.dataset.folder, el.dataset.name); break;
    case 'fs-connect': try { await FS.connect(); render(); } catch (err) { if (err.name !== 'AbortError') toast('No se pudo conectar la carpeta: ' + err.message, 'error'); } break;
    case 'fs-reconnect': try { await FS.reconnect(); render(); refreshDocModal(); } catch (err) { toast('No se pudo reconectar: ' + err.message, 'error'); } break;
    case 'fs-sync': await FS.sync(); render(); toast('Carpeta sincronizada.', 'ok'); break;
    case 'fs-disconnect': confirmBox('Se dejará de usar la carpeta en este navegador. Los archivos de la carpeta no se borran.', () => FS.disconnect(), 'Desconectar'); break;
    case 'fill-demo': {
      const E = $('#newForm').elements; const n = String(458721 + Store.docs().length);
      E.docid.value = Store.get('458721') ? n : '458721'; E.factura.value = '4589'; E.proveedor.value = 'PROVEEDOR EJEMPLO SPA'; E.oc.value = '78451'; E.monto.value = '1250000'; break;
    }
    case 'quick-user': $('#lu').value = USERS[el.dataset.u].login; $('#lp').value = '1234'; $('#lerr').textContent = ''; break;
    case 'reset-demo': confirmBox('Se eliminarán los documentos y firmas guardados en este navegador. Los archivos y el registro de la carpeta conectada NO se borran (se volverán a cargar al sincronizar).', () => {
      [LS.docs, LS.firmas, LS.session].forEach(k => localStorage.removeItem(k)); Store.clear().then(() => BC && BC.postMessage('upd')); FS.rc = {}; state.user = null; render(); toast('Datos locales reiniciados.', 'ok');
    }, 'Reiniciar'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const all = document.querySelectorAll('.backdrop'); if (all.length) closeModal(all[all.length - 1].dataset.key); }
});
/* Sincronización automática con la carpeta compartida */
window.addEventListener('focus', () => FS.sync(true));
setInterval(() => FS.sync(true), 15000);
if (BC) BC.onmessage = async () => { await Store.reload(); if (me()) { render(); refreshDocModal(); checkArrivals(); } };

Store.init().then(() => SIGS.init()).then(() => { render(); return LIBRO.init(); }).then(() => FS.init()).then(() => { if (EN_PORTAL) return portalLogin(); render(); if (me()) startQueue(); });
</script>
</body>
</html>
